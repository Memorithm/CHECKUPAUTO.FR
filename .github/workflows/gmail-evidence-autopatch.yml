name: Gmail evidence feature patch

on:
  push:
    branches: [feat/gmail-operational-integration]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/gmail-operational-integration
      - name: Apply bounded IntegrationHub patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('integration_hub.py')
          text = path.read_text()
          replacements = [
              (
                  'import requests\n\nfrom google_ads_probe import (',
                  'import requests\n\nimport gmail_operational_evidence as gmail_evidence\n\nfrom google_ads_probe import (',
              ),
              (
                  '\n\ndef status(legacy_search_console=None, base_url="", *, verify_remote=None):',
                  '''\n\ndef _apply_gmail_operational_evidence(row):\n    evidence = gmail_evidence.status()\n    verification = str(evidence.get("verification") or "unavailable")\n    if verification not in {"verified", "unavailable", "unverified"}:\n        verification = "unavailable"\n    row["verification"] = verification\n    row["operationalEvidence"] = {\n        "operationallyVerified": bool(evidence.get("operationallyVerified")),\n        "circuitOpen": bool(evidence.get("circuitOpen")),\n        "consecutiveFailures": max(0, int(evidence.get("consecutiveFailures") or 0)),\n    }\n    if verification == "verified":\n        row["connected"] = True\n        row["state"] = "connected"\n        row["detail"] = "OAuth Gmail autorisé · livraison réelle vérifiée"\n    elif verification == "unavailable":\n        row["connected"] = False\n        row["state"] = "attention"\n        row["detail"] = "OAuth Gmail autorisé · preuve de livraison actuellement indisponible"\n    else:\n        row["connected"] = False\n        row["state"] = "attention"\n        row["detail"] = "OAuth Gmail autorisé · aucune livraison réelle vérifiée"\n    return row\n\n\ndef status(legacy_search_console=None, base_url="", *, verify_remote=None):''',
              ),
              (
                  '            elif key == "google_ads":\n                _apply_google_ads_probe(row, cfg)\n            elif key == "calendar":',
                  '            elif key == "google_ads":\n                _apply_google_ads_probe(row, cfg)\n            elif key == "gmail":\n                _apply_gmail_operational_evidence(row)\n            elif key == "calendar":',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one replacement, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          Path('integration_hub_gmail_operational_test.py').write_text('''import sqlite3\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nimport gmail_operational_evidence as evidence\nimport integration_hub as hub\n\n\nclass IntegrationHubGmailOperationalTest(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.TemporaryDirectory()\n        root = Path(self.tmp.name)\n        self.original = (\n            hub.PRIVATE_DIR, hub.INTEGRATION_DIR, hub.CLIENT_FILE,\n            hub.TOKEN_FILE, hub.SETTINGS_FILE, hub.STATE_FILE, evidence.DB,\n        )\n        hub.PRIVATE_DIR = root\n        hub.INTEGRATION_DIR = root / "integrations"\n        hub.CLIENT_FILE = hub.INTEGRATION_DIR / "google-oauth-client.json"\n        hub.TOKEN_FILE = hub.INTEGRATION_DIR / "google-oauth-token.json"\n        hub.SETTINGS_FILE = hub.INTEGRATION_DIR / "google-settings.json"\n        hub.STATE_FILE = hub.INTEGRATION_DIR / "google-oauth-state.json"\n        evidence.DB = root / "notification-broker.sqlite3"\n        hub.save_oauth_client({"web": {\n            "client_id": "client-id.apps.googleusercontent.com",\n            "client_secret": "test-only-secret",\n            "token_uri": hub.TOKEN_URL,\n            "redirect_uris": ["https://www.checkupauto.fr/api/integrations/google/oauth/callback"],\n        }})\n        hub._atomic_json(hub.TOKEN_FILE, {\n            "refresh_token": "test-only-refresh",\n            "scope": "https://www.googleapis.com/auth/gmail.send",\n        })\n        hub.save_settings({"gmailSender": "contact@checkupauto.fr"})\n\n    def tearDown(self):\n        (hub.PRIVATE_DIR, hub.INTEGRATION_DIR, hub.CLIENT_FILE, hub.TOKEN_FILE,\n         hub.SETTINGS_FILE, hub.STATE_FILE, evidence.DB) = self.original\n        self.tmp.cleanup()\n\n    def _gmail(self):\n        state = hub.status({}, "https://www.checkupauto.fr", verify_remote=True)\n        return next(item for item in state["connectors"] if item["id"] == "gmail")\n\n    def _health(self, *, success="", failure="", failures=0, open_until=""):\n        with sqlite3.connect(evidence.DB) as db:\n            db.execute("""CREATE TABLE notification_transport_health(\n                transport_key TEXT PRIMARY KEY, consecutive_failures INTEGER NOT NULL,\n                open_until TEXT NOT NULL, last_failure_at TEXT NOT NULL,\n                last_success_at TEXT NOT NULL)""")\n            db.execute(\n                "INSERT INTO notification_transport_health VALUES(?,?,?,?,?)",\n                (evidence.TRANSPORT_KEY, failures, open_until, failure, success),\n            )\n\n    def test_authorized_gmail_without_delivery_history_is_unverified(self):\n        gmail = self._gmail()\n        self.assertFalse(gmail["connected"])\n        self.assertEqual(gmail["state"], "attention")\n        self.assertEqual(gmail["verification"], "unverified")\n        self.assertNotIn("lastSuccessAt", gmail["operationalEvidence"])\n\n    def test_real_delivery_marks_gmail_verified(self):\n        self._health(success="2026-09-21T15:00:00+00:00")\n        gmail = self._gmail()\n        self.assertTrue(gmail["connected"])\n        self.assertEqual(gmail["verification"], "verified")\n        self.assertTrue(gmail["operationalEvidence"]["operationallyVerified"])\n\n    def test_recent_delivery_failure_marks_gmail_unavailable(self):\n        self._health(\n            success="2026-09-21T15:00:00+00:00",\n            failure="2026-09-21T16:00:00+00:00", failures=1,\n        )\n        gmail = self._gmail()\n        self.assertFalse(gmail["connected"])\n        self.assertEqual(gmail["verification"], "unavailable")\n        self.assertEqual(gmail["operationalEvidence"]["consecutiveFailures"], 1)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Validate patched sources
        run: python3 -m py_compile integration_hub.py gmail_operational_evidence.py integration_hub_gmail_operational_test.py
      - name: Commit feature patch and remove helper workflow
        run: |
          rm .github/workflows/gmail-evidence-autopatch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integration_hub.py gmail_operational_evidence.py integration_hub_gmail_operational_test.py .github/workflows/gmail-evidence-autopatch.yml
          git commit -m 'feat: bind Gmail operational evidence to IntegrationHub'
          git push origin HEAD:feat/gmail-operational-integration
