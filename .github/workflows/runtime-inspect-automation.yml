name: Runtime inspect automation

on:
  push:
    branches: [automation/runtime-inspect-20260921-1315]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inspect production and Mac reachability
        shell: bash
        run: |
          set -eu
          echo "RUNNER_USER=$(id -un)"
          echo "RUNNER_HOST=$(hostname)"
          echo "MAIN_SHA=$(git rev-parse origin/main)"

          if git -C /root/CyberCheckLive rev-parse HEAD >/dev/null 2>&1; then
            prod_sha="$(git -C /root/CyberCheckLive rev-parse HEAD)"
            echo "PRODUCTION_SHA=$prod_sha"
            echo "PRODUCTION_BRANCH=$(git -C /root/CyberCheckLive branch --show-current)"
            dirty="$(git -C /root/CyberCheckLive status --porcelain | wc -l | tr -d ' ')"
            echo "PRODUCTION_DIRTY_COUNT=$dirty"
            if git merge-base --is-ancestor "$prod_sha" origin/main 2>/dev/null; then
              echo "PRODUCTION_ANCESTOR_OF_MAIN=1"
              behind="$(git rev-list --count "$prod_sha"..origin/main)"
              echo "PRODUCTION_COMMITS_BEHIND_MAIN=$behind"
            else
              echo "PRODUCTION_ANCESTOR_OF_MAIN=0"
            fi
          else
            echo "PRODUCTION_REPO_READABLE=0"
          fi

          service_state="$(systemctl is-active cybercheck.service 2>/dev/null || true)"
          echo "CYBERCHECK_SERVICE_STATE=${service_state:-unknown}"
          http_code="$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/ 2>/dev/null || true)"
          echo "CYBERCHECK_HTTP_CODE=${http_code:-unreachable}"

          if [ -r /root/CyberCheckPrivate/admin-password ]; then
            admin_password="$(cat /root/CyberCheckPrivate/admin-password)"
            readiness="$(curl -sS --max-time 10 -u "admin:${admin_password}" http://127.0.0.1:8765/api/admin/readiness 2>/dev/null || true)"
            unset admin_password
            READINESS_JSON="$readiness" python3 - <<'PY'
          import json, os
          raw = os.environ.get("READINESS_JSON", "")
          try:
              payload = json.loads(raw)
          except Exception:
              print("READINESS_PARSEABLE=0")
          else:
              print("READINESS_PARSEABLE=1")
              print("READINESS_OK=" + str(bool(payload.get("ok"))).lower())
              print("READINESS_STATE=" + str(payload.get("state") or payload.get("status") or "unknown"))
              print("READINESS_LAUNCH_READY=" + str(bool(payload.get("launchReady"))).lower())
              gate = payload.get("activationGate")
              if isinstance(gate, dict):
                  allowed = gate.get("allowed")
                  blockers = gate.get("blockers") or []
              else:
                  allowed = gate
                  blockers = []
              print("READINESS_ACTIVATION_ALLOWED=" + str(bool(allowed)).lower())
              print("READINESS_BLOCKER_COUNT=" + str(len(blockers) if isinstance(blockers, list) else 0))
          PY
          else
            echo "READINESS_PRIVATE_CREDENTIAL_READABLE=0"
          fi

          if getent hosts Mac-mini-de-tarek.local >/dev/null 2>&1; then
            echo "MAC_DNS_RESOLVES=1"
            getent hosts Mac-mini-de-tarek.local | awk 'NR==1 {print "MAC_IP=" $1}'
          else
            echo "MAC_DNS_RESOLVES=0"
          fi
          if timeout 4 bash -c '</dev/tcp/Mac-mini-de-tarek.local/22' 2>/dev/null; then
            echo "MAC_SSH_PORT_REACHABLE=1"
          else
            echo "MAC_SSH_PORT_REACHABLE=0"
          fi
          if [ -d "$HOME/.ssh" ]; then
            count="$(find "$HOME/.ssh" -maxdepth 1 -type f ! -name '*.pub' ! -name 'known_hosts*' ! -name 'authorized_keys' | wc -l | tr -d ' ')"
            echo "RUNNER_PRIVATE_KEY_FILE_COUNT=$count"
            if ssh-keygen -F Mac-mini-de-tarek.local -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              echo "MAC_KNOWN_HOST_PRESENT=1"
            else
              echo "MAC_KNOWN_HOST_PRESENT=0"
            fi
          else
            echo "RUNNER_PRIVATE_KEY_FILE_COUNT=0"
            echo "MAC_KNOWN_HOST_PRESENT=0"
          fi
