name: iOS Core CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - '.github/workflows/ios-core-ci.yml'
  pull_request:
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - '.github/workflows/ios-core-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted macOS by default: the self-hosted Mac pool has not picked up
    # a job since 2026-10-03. Set the repository variable
    # CHECKUPAUTO_IOS_SELF_HOSTED=true to return to the private Mac runners.
    # No secret is used by this job.
    runs-on: ${{ vars.CHECKUPAUTO_IOS_SELF_HOSTED == 'true' && fromJSON('["self-hosted","macOS","ARM64","checkupauto","ios","ios-light"]') || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Xcode 26 on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          # The Live Activity code needs the iOS 26 SDK; the image default is older.
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install XcodeGen when missing
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          sw_vers
          xcodebuild -version
          xcodegen --version
          swift --version
      - name: Run Swift package tests
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          swift package resolve
          swift test --parallel
      - name: Verify live staging API contract
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          swiftc -D DEBUG Sources/MobileAPI.swift Sources/MobileBootstrap.swift Monitoring/LiveStagingBootstrapSmoke.swift -o /tmp/checkupauto-live-staging
          # Staging occasionally exceeds the 8 s client timeout: retry before failing.
          for attempt in 1 2 3; do
            if CHECKUPAUTO_API_BASE_URL='https://test.checkupauto.fr' /tmp/checkupauto-live-staging; then
              exit 0
            fi
            echo "::warning::live staging smoke attempt $attempt failed"
            sleep 15
          done
          exit 1
  xcode:
    needs: swift
    runs-on: ${{ vars.CHECKUPAUTO_IOS_SELF_HOSTED == 'true' && fromJSON('["self-hosted","macOS","ARM64","checkupauto","ios","ios-heavy"]') || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Xcode 26 on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          # The Live Activity code needs the iOS 26 SDK; the image default is older.
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install XcodeGen when missing
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate project and run simulator tests
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          xcodegen generate
          # GitHub-hosted macOS images may contain the iOS SDK without an
          # installed simulator runtime (or without an iPhone 16 Pro device).
          # Never mark Xcode CI green by replacing simulator tests with a build.
          find_iphone() {
            xcrun simctl list devices available --json | python3 -c '
          import json, sys
          groups = json.load(sys.stdin).get("devices", {})
          for _, devices in sorted(groups.items(), reverse=True):
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          '
          }
          simulator_id="$(find_iphone)"
          if [[ -z "$simulator_id" ]]; then
            echo "::notice::No installed iPhone simulator. Downloading the iOS simulator runtime."
            xcodebuild -downloadPlatform iOS
            simulator_id="$(find_iphone)"
          fi
          if [[ -z "$simulator_id" ]]; then
            runtime_id="$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = [
              entry for entry in json.load(sys.stdin).get("runtimes", [])
              if entry.get("isAvailable") and ".iOS-" in entry.get("identifier", "")
          ]
          runtimes.sort(key=lambda entry: tuple(int(x) for x in entry.get("version", "0").split(".")), reverse=True)
          if runtimes:
              print(runtimes[0]["identifier"])
          ')"
            device_type="$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          types = [
              entry for entry in json.load(sys.stdin).get("devicetypes", [])
              if entry.get("name", "").startswith("iPhone")
          ]
          if types:
              print(types[-1]["identifier"])
          ')"
            test -n "$runtime_id"
            test -n "$device_type"
            simulator_id="$(xcrun simctl create "CheckupAuto-CI-iPhone" "$device_type" "$runtime_id")"
          fi
          test -n "$simulator_id"
          echo "CHECKUPAUTO_SIMULATOR_ID=$simulator_id"
          xcodebuild test -project CheckupAutoReminder.xcodeproj -scheme CheckupAutoReminder -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO
