name: iOS Core CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_project_manifest_test.py'
      - 'ios_release_preflight.py'
      - 'ios_release_preflight_test.py'
      - 'ios_release_runner.py'
      - 'ios_release_runner_test.py'
      - '.github/workflows/ios-core-ci.yml'
  pull_request:
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_project_manifest_test.py'
      - 'ios_release_preflight.py'
      - 'ios_release_preflight_test.py'
      - 'ios_release_runner.py'
      - 'ios_release_runner_test.py'
      - '.github/workflows/ios-core-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-and-xcode:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 30
    env:
      CHECKUPAUTO_MAC_HOST: Mac-mini-de-tarek.local
      CHECKUPAUTO_MAC_USER: tarek
      CHECKUPAUTO_MAC_KEY: /root/.ssh/checkupauto_macmini_ed25519
    steps:
      - uses: actions/checkout@v5
      - name: Validate iOS release tooling contracts
        run: python3 -m unittest ios_project_manifest_test ios_release_preflight_test ios_release_runner_test
      - name: Verify remote Apple toolchain
        run: |
          set -euo pipefail
          test -r "$CHECKUPAUTO_MAC_KEY"
          ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            'sw_vers; xcodebuild -version; xcodegen --version; swift --version'
      - name: Stage exact iOS source on Mac mini
        run: |
          set -euo pipefail
          remote_dir="/tmp/checkupauto-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$remote_dir" > .ios-remote-dir
          ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          tar -czf - ios/CheckupAutoReminder | \
            ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
              "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" "tar -xzf - -C '$remote_dir'"
      - name: Run Swift package tests on Mac mini
        run: |
          set -euo pipefail
          remote_dir="$(cat .ios-remote-dir)"
          ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            "cd '$remote_dir/ios/CheckupAutoReminder' && swift package resolve && swift test --parallel"
      - name: Generate Xcode project and run iOS simulator tests
        run: |
          set -euo pipefail
          remote_dir="$(cat .ios-remote-dir)"
          ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            "set -euo pipefail; cd '$remote_dir/ios/CheckupAutoReminder'; xcodegen generate; xcodebuild test -project CheckupAutoReminder.xcodeproj -scheme CheckupAutoReminder -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 18 Pro' -derivedDataPath '$remote_dir/DerivedData' CODE_SIGNING_ALLOWED=NO"
      - name: Clean remote staging directory
        if: always()
        run: |
          set -u
          if [ -s .ios-remote-dir ] && [ -r "$CHECKUPAUTO_MAC_KEY" ]; then
            remote_dir="$(cat .ios-remote-dir)"
            ssh -i "$CHECKUPAUTO_MAC_KEY" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
              "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" "rm -rf '$remote_dir'" || true
          fi
