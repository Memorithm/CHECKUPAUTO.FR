name: iOS Core CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - '.github/workflows/ios-core-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-and-xcode:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 30
    env:
      CHECKUPAUTO_MAC_HOST: Mac-mini-de-tarek.local
      CHECKUPAUTO_MAC_USER: tarek
    steps:
      - uses: actions/checkout@v5
      - name: Verify Mac SSH endpoint
        run: |
          set -euo pipefail
          getent hosts "$CHECKUPAUTO_MAC_HOST" >/dev/null || {
            echo '::error::Mac mini hostname is not resolvable from the internal runner'
            exit 2
          }
          timeout 5 bash -c "</dev/tcp/$CHECKUPAUTO_MAC_HOST/22" || {
            echo '::error::Mac mini SSH port 22 is not reachable from the internal runner'
            exit 2
          }
      - name: Resolve authorized Mac SSH identity
        env:
          CHECKUPAUTO_MAC_SSH_KEY: ${{ secrets.CHECKUPAUTO_MAC_SSH_KEY }}
        run: |
          set -euo pipefail
          tmp_key="$RUNNER_TEMP/checkupauto-mac-key"
          auth_file=".ios-mac-auth"
          rm -f "$tmp_key" "$auth_file"
          umask 077

          verify_key() {
            candidate="$1"
            [ -r "$candidate" ] || return 1
            timeout 3 ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || return 1
            timeout 8 ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1
          }

          if [ -n "${CHECKUPAUTO_MAC_SSH_KEY:-}" ]; then
            printf '%s\n' "$CHECKUPAUTO_MAC_SSH_KEY" > "$tmp_key"
            verify_key "$tmp_key" || {
              echo '::error::Configured CHECKUPAUTO_MAC_SSH_KEY is not authorized on the Mac mini'
              exit 2
            }
            printf '%s\n' key > "$auth_file"
          elif timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
            "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1; then
            printf '%s\n' default > "$auth_file"
          else
            source_key=""
            for candidate in \
              /root/.ssh/checkupauto_macmini_ed25519 \
              "$HOME/.ssh/checkupauto_macmini_ed25519" \
              /opt/actions-runner/.ssh/checkupauto_macmini_ed25519 \
              /root/.ssh/id_ed25519 \
              "$HOME/.ssh/id_ed25519" \
              /opt/actions-runner/.ssh/id_ed25519 \
              /root/.ssh/id_rsa \
              "$HOME/.ssh/id_rsa" \
              /opt/actions-runner/.ssh/id_rsa; do
              if verify_key "$candidate"; then
                source_key="$candidate"
                break
              fi
            done
            if [ -z "$source_key" ]; then
              while IFS= read -r candidate; do
                if verify_key "$candidate"; then
                  source_key="$candidate"
                  break
                fi
              done < <(
                find /root/.ssh /opt/actions-runner /home -maxdepth 4 -type f \
                  \( -name '*macmini*' -o -name 'checkupauto*ed25519' -o -name 'id_ed25519' -o -name 'id_rsa' \) \
                  -readable -print 2>/dev/null || true
              )
            fi
            if [ -z "$source_key" ]; then
              echo '::error::No authorized Mac mini SSH identity is available. Configure the CHECKUPAUTO_MAC_SSH_KEY Actions secret or provision a private key on the internal runner.'
              exit 2
            fi
            cp "$source_key" "$tmp_key"
            chmod 600 "$tmp_key"
            printf '%s\n' key > "$auth_file"
          fi
          if [ -s "$tmp_key" ]; then
            printf '%s\n' "$tmp_key" > .ios-mac-key
          fi
      - name: Verify remote Apple toolchain
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat .ios-mac-auth)" = key ]; then
            ssh_args+=(-i "$(cat .ios-mac-key)" -o IdentitiesOnly=yes)
          fi
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            'sw_vers; xcodebuild -version; xcodegen --version; swift --version'
      - name: Stage exact iOS source on Mac mini
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat .ios-mac-auth)" = key ]; then
            ssh_args+=(-i "$(cat .ios-mac-key)" -o IdentitiesOnly=yes)
          fi
          remote_dir="/tmp/checkupauto-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$remote_dir" > .ios-remote-dir
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          tar -czf - ios/CheckupAutoReminder ios_release_runner.py | \
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
              "tar -xzf - -C '$remote_dir'"
      - name: Run Swift package tests on Mac mini
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat .ios-mac-auth)" = key ]; then
            ssh_args+=(-i "$(cat .ios-mac-key)" -o IdentitiesOnly=yes)
          fi
          remote_dir="$(cat .ios-remote-dir)"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            "cd '$remote_dir/ios/CheckupAutoReminder' && swift package resolve && swift test --parallel"
      - name: Generate Xcode project and run iOS simulator tests
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat .ios-mac-auth)" = key ]; then
            ssh_args+=(-i "$(cat .ios-mac-key)" -o IdentitiesOnly=yes)
          fi
          remote_dir="$(cat .ios-remote-dir)"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
            "set -euo pipefail; destination=\$(cd '$remote_dir' && python3 -c 'import ios_release_runner as r; print(r.discover_simulator()[\"destination\"])'); cd '$remote_dir/ios/CheckupAutoReminder'; xcodegen generate; xcodebuild test -project CheckupAutoReminder.xcodeproj -scheme CheckupAutoReminder -configuration Debug -destination \"\$destination\" -derivedDataPath '$remote_dir/DerivedData' CODE_SIGNING_ALLOWED=NO"
      - name: Clean remote staging directory and ephemeral identity
        if: always()
        run: |
          set -u
          key=""
          if [ -s .ios-mac-key ]; then
            key="$(cat .ios-mac-key)"
          fi
          if [ -s .ios-mac-auth ] && [ -s .ios-remote-dir ]; then
            ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
            if [ "$(cat .ios-mac-auth)" = key ] && [ -n "$key" ]; then
              ssh_args+=(-i "$key" -o IdentitiesOnly=yes)
            fi
            remote_dir="$(cat .ios-remote-dir)"
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" \
              "rm -rf '$remote_dir'" || true
          fi
          if [ -n "$key" ]; then
            rm -f "$key"
          fi
          rm -f .ios-mac-key .ios-remote-dir
          rm -f .ios-mac-auth
