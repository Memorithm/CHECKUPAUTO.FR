name: iOS Core CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - '.github/workflows/ios-core-ci.yml'
  pull_request:
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - '.github/workflows/ios-core-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted macOS by default: the self-hosted Mac pool has not picked up
    # a job since 2026-10-03. Set the repository variable
    # CHECKUPAUTO_IOS_SELF_HOSTED=true to return to the private Mac runners.
    # No secret is used by this job.
    runs-on: ${{ vars.CHECKUPAUTO_IOS_SELF_HOSTED == 'true' && fromJSON('["self-hosted","macOS","ARM64","checkupauto","ios","ios-light"]') || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false




      - name: Install XcodeGen when missing
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          sw_vers
          xcodebuild -version
          xcodegen --version
          swift --version
      - name: Run Swift package tests
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          swift package resolve
          swift test --parallel
      - name: Verify live staging API contract
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          swiftc -D DEBUG Sources/MobileAPI.swift Sources/MobileBootstrap.swift Monitoring/LiveStagingBootstrapSmoke.swift -o /tmp/checkupauto-live-staging
          CHECKUPAUTO_API_BASE_URL='https://test.checkupauto.fr' /tmp/checkupauto-live-staging
  xcode:
    needs: swift
    runs-on: ${{ vars.CHECKUPAUTO_IOS_SELF_HOSTED == 'true' && fromJSON('["self-hosted","macOS","ARM64","checkupauto","ios","ios-heavy"]') || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install XcodeGen when missing
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate project and run simulator tests
        working-directory: ios/CheckupAutoReminder
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          xcodegen generate
          xcodebuild test -project CheckupAutoReminder.xcodeproj -scheme CheckupAutoReminder -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO
