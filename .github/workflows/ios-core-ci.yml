name: iOS Core CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_project_manifest_test.py'
      - 'ios_release_preflight.py'
      - 'ios_release_preflight_test.py'
      - 'ios_release_runner.py'
      - 'ios_release_runner_test.py'
      - '.github/workflows/ios-core-ci.yml'
  pull_request:
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_project_manifest_test.py'
      - 'ios_release_preflight.py'
      - 'ios_release_preflight_test.py'
      - 'ios_release_runner.py'
      - 'ios_release_runner_test.py'
      - '.github/workflows/ios-core-ci.yml'

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Record Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Validate iOS release tooling contracts
        run: python3 -m unittest ios_project_manifest_test ios_release_preflight_test ios_release_runner_test
      - name: Resolve Swift package
        run: swift package --package-path ios/CheckupAutoReminder resolve
      - name: Run Swift package tests
        run: swift test --package-path ios/CheckupAutoReminder --parallel
