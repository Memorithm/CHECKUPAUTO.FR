name: one-shot referral trigger race fix

on:
  push:
    branches: [fix/referral-trigger-init-race]

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/referral-trigger-init-race
      - name: Apply concurrency-safe trigger initialization and regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('referral_engine.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "            DROP TRIGGER IF EXISTS trg_referral_ledger_nonnegative;\n            CREATE TRIGGER trg_referral_ledger_nonnegative":
              "            -- Never DROP these invariant triggers during normal init: concurrent\n            -- callers could otherwise observe a missing trigger or race on CREATE.\n            CREATE TRIGGER IF NOT EXISTS trg_referral_ledger_nonnegative",
              "            DROP TRIGGER IF EXISTS trg_referral_ledger_reverse_matches_earn;\n            CREATE TRIGGER trg_referral_ledger_reverse_matches_earn":
              "            CREATE TRIGGER IF NOT EXISTS trg_referral_ledger_reverse_matches_earn",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected trigger migration shape: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          cat > referral_init_concurrency_test.py <<'PY'
          import tempfile
          import threading
          import unittest
          from pathlib import Path

          import analytics_store as analytics
          import referral_engine as referrals


          class ReferralInitConcurrencyTest(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.tmp.cleanup)
                  self.original_db = analytics.DB
                  analytics.DB = Path(self.tmp.name) / "analytics.sqlite3"
                  self.addCleanup(self._restore_db)

              def _restore_db(self):
                  analytics.DB = self.original_db

              def test_concurrent_init_is_idempotent_and_preserves_invariant_triggers(self):
                  referrals.init_db()
                  workers = 8
                  barrier = threading.Barrier(workers)
                  errors = []
                  lock = threading.Lock()

                  def initialize_repeatedly():
                      barrier.wait()
                      try:
                          for _ in range(20):
                              referrals.init_db()
                      except Exception as exc:
                          with lock:
                              errors.append(exc)

                  threads = [threading.Thread(target=initialize_repeatedly) for _ in range(workers)]
                  for thread in threads:
                      thread.start()
                  for thread in threads:
                      thread.join(timeout=20)

                  self.assertEqual(errors, [])
                  self.assertTrue(all(not thread.is_alive() for thread in threads))
                  with analytics.connect() as db:
                      triggers = {
                          row["name"]
                          for row in db.execute(
                              "SELECT name FROM sqlite_master WHERE type='trigger' AND name LIKE 'trg_referral_ledger_%'"
                          )
                      }
                  self.assertEqual(
                      triggers,
                      {
                          "trg_referral_ledger_nonnegative",
                          "trg_referral_ledger_reverse_matches_earn",
                      },
                  )


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-referral-trigger-race-fix.yml
          git add referral_engine.py referral_init_concurrency_test.py
          git config user.name 'CHECKUPAUTO'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'fix: make referral trigger initialization concurrency-safe'
          git push origin HEAD:fix/referral-trigger-init-race
