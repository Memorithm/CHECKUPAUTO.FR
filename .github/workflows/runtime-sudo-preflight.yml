name: Check runtime deployment privileges

on:
  push:
    branches: [automation/runtime-inspect]
    paths:
      - '.github/workflows/runtime-sudo-preflight.yml'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check noninteractive sudo and runtime data layout
        run: |
          set -euo pipefail
          if sudo -n true; then
            echo 'SUDO_NONINTERACTIVE=yes'
          else
            echo 'SUDO_NONINTERACTIVE=no'
            exit 2
          fi
          sudo -n bash -lc '
            set -euo pipefail
            for dir in /root/CyberCheckData /root/CyberCheckLive/data; do
              if [ -d "$dir" ]; then
                echo "DATA_DIR_PRESENT=$dir"
                find "$dir" -maxdepth 2 -type f \( -name "*.sqlite" -o -name "*.sqlite3" -o -name "*.db" \) -printf "DB_FILE=%p\n" | sort
              fi
            done
            command -v sqlite3 >/dev/null && echo SQLITE3_CLI=yes || echo SQLITE3_CLI=no
          '
      - name: Remove privilege preflight bootstrap
        if: always()
        run: |
          rm -f .github/workflows/runtime-sudo-preflight.yml
          git add -A
          git config user.name 'CHECKUPAUTO Automation'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'chore: remove runtime privilege preflight bootstrap' || true
          git push origin HEAD:automation/runtime-inspect || true
