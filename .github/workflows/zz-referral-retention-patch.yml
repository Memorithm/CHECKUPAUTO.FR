name: Referral retention branch patch

on:
  push:
    branches:
      - feat/referral-retention-bridge

permissions:
  contents: write

concurrency:
  group: referral-retention-patch
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[retention-patched]') }}
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact retention integration
        run: python3 scripts/patch_referral_retention.py
      - name: Validate patch syntax
        run: |
          python3 -m py_compile retention_enforcement.py
          git diff --check
      - name: Commit branch patch
        run: |
          set -euo pipefail
          git config user.name 'CHECKUPAUTO'
          git config user.email 'contact@checkupauto.fr'
          git add retention_enforcement.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: bind referral compaction to retention [retention-patched]'
          git push origin HEAD:feat/referral-retention-bridge
