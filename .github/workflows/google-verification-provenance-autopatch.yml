name: Google verification provenance feature patch

on:
  push:
    branches: [fix/google-verification-provenance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/google-verification-provenance
      - name: Apply bounded provenance patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hub = Path('integration_hub.py')
          text = hub.read_text()
          old = '''        if meta["mode"] == "api_key" and extra_ok:\n            row["verification"] = "unverified"\n        if row["connected"] and verify_remote:\n            if key == "analytics":\n                _apply_analytics_probe(row, cfg)\n            elif key == "business_profile":\n                _apply_business_profile_probe(row, cfg)\n            elif key == "tag_manager":\n                _apply_tag_manager_probe(row, cfg)\n            elif key == "google_ads":\n                _apply_google_ads_probe(row, cfg)\n            elif key == "gmail":\n                _apply_gmail_operational_evidence(row)\n            elif key == "calendar":\n                _apply_calendar_probe(row)\n            elif key == "drive":\n                _apply_drive_probe(row)\n'''
          new = '''        if meta["mode"] == "api_key" and extra_ok:\n            row["verification"] = "unverified"\n            row["verificationSource"] = "configuration"\n        if row["connected"] and verify_remote:\n            if key == "analytics":\n                row["verificationSource"] = "remote_api"\n                _apply_analytics_probe(row, cfg)\n            elif key == "business_profile":\n                row["verificationSource"] = "remote_api"\n                _apply_business_profile_probe(row, cfg)\n            elif key == "tag_manager":\n                row["verificationSource"] = "remote_api"\n                _apply_tag_manager_probe(row, cfg)\n            elif key == "google_ads":\n                row["verificationSource"] = "remote_api"\n                _apply_google_ads_probe(row, cfg)\n            elif key == "gmail":\n                row["verificationSource"] = "operational_delivery"\n                _apply_gmail_operational_evidence(row)\n            elif key == "calendar":\n                row["verificationSource"] = "remote_api"\n                _apply_calendar_probe(row)\n            elif key == "drive":\n                row["verificationSource"] = "remote_api"\n                _apply_drive_probe(row)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'integration_hub patch anchor count={text.count(old)}')
          hub.write_text(text.replace(old, new, 1))

          readiness = Path('production_readiness.py')
          text = readiness.read_text()
          old = '''    verified = sum(1 for item in connectors if item.get("verification") == "verified")\n    failed = sum(1 for item in connectors if item.get("verification") == "failed")\n    unavailable = sum(1 for item in connectors if item.get("verification") == "unavailable")\n    unverified = sum(1 for item in connectors if item.get("verification") == "unverified")\n    remote_checked = verified + failed + unavailable\n'''
          new = '''    verified = sum(1 for item in connectors if item.get("verification") == "verified")\n    failed = sum(1 for item in connectors if item.get("verification") == "failed")\n    unavailable = sum(1 for item in connectors if item.get("verification") == "unavailable")\n    unverified = sum(1 for item in connectors if item.get("verification") == "unverified")\n\n    def verification_source(item):\n        explicit = str(item.get("verificationSource") or "").strip()\n        if explicit:\n            return explicit\n        # Backward-compatible inference for older IntegrationHub payloads and tests.\n        if item.get("id") == "gmail" and item.get("verification"):\n            return "operational_delivery"\n        if item.get("id") == "maps_places" and item.get("verification") == "unverified":\n            return "configuration"\n        if item.get("verification") in {"verified", "failed", "unavailable"}:\n            return "remote_api"\n        return ""\n\n    remote_checked = sum(\n        1 for item in connectors\n        if verification_source(item) == "remote_api"\n        and item.get("verification") in {"verified", "failed", "unavailable"}\n    )\n    operational_checked = sum(\n        1 for item in connectors\n        if verification_source(item) == "operational_delivery"\n        and item.get("verification") in {"verified", "failed", "unavailable"}\n    )\n    configuration_only = sum(\n        1 for item in connectors\n        if verification_source(item) == "configuration"\n        and item.get("verification") == "unverified"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'production_readiness metrics anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              'google_detail = f"{unavailable} vérification(s) Google temporairement indisponible(s)"',
              'google_detail = f"{unavailable} vérification(s) d’intégration temporairement indisponible(s)"',
              1,
          )
          text = text.replace(
              'google_detail = f"{unverified} connecteur(s) configuré(s) sans vérification distante"',
              'google_detail = f"{unverified} connecteur(s) configuré(s) sans preuve de vérification exploitable"',
              1,
          )
          old = '''            "unverifiedVerifications": unverified,\n            "remoteCheckedConnectors": remote_checked,\n'''
          new = '''            "unverifiedVerifications": unverified,\n            "remoteCheckedConnectors": remote_checked,\n            "operationalCheckedConnectors": operational_checked,\n            "configurationOnlyConnectors": configuration_only,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'production_readiness output anchor count={text.count(old)}')
          readiness.write_text(text.replace(old, new, 1))
          PY
      - name: Validate patched sources
        run: python3 -m py_compile integration_hub.py production_readiness.py
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/google-verification-provenance-autopatch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integration_hub.py production_readiness.py .github/workflows/google-verification-provenance-autopatch.yml
          git commit -m 'fix: preserve Google verification provenance'
          git push origin HEAD:fix/google-verification-provenance
