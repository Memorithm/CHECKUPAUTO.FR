name: Isolated site preview

on:
  pull_request:
    paths: ['site_preview.py', 'site_preview_test.py', '.github/workflows/site-preview.yml', 'index.html', 'style.css', 'assets/**']
  push:
    branches: [main]
    paths: ['site_preview.py', 'site_preview_test.py', '.github/workflows/site-preview.yml', 'index.html', 'style.css', 'assets/**']

permissions:
  contents: read

concurrency:
  group: checkupauto-static-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 6
    env:
      PREVIEW_OUT: ${{ github.workspace }}/.checkupauto-preview-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test and export only the visual frontend
        run: |
          set -euo pipefail
          python3 -m unittest site_preview_test
          python3 -c 'import site_preview; print(site_preview.PREVIEW_JS)' | node --check
          python3 site_preview.py --sha "$(git rev-parse HEAD)" --output "$PREVIEW_OUT"
      - name: Save the portable preview, never the repository or runtime state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkupauto-visual-preview
          path: |
            ${{ env.PREVIEW_OUT }}/index.html
            ${{ env.PREVIEW_OUT }}/preview.json
          if-no-files-found: error
          retention-days: 14
      # This is NOT the Python application deployment. No Passenger settings,
      # production paths, DNS records, secrets, databases or schedulers are changed.
      - name: Publish a static file under the isolated staging document root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shlex
          import socket
          import stat
          import subprocess
          import urllib.error
          import urllib.request

          root = pathlib.Path(os.environ['PREVIEW_OUT'])
          evidence = json.loads((root / 'preview.json').read_text())
          sha = evidence['sourceSha']
          digest = evidence['sha256']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Invalid preview evidence')
          body = (root / 'index.html').read_bytes()
          if len(body) > 6 * 1024 * 1024 or hashlib.sha256(body).hexdigest() != digest:
              raise SystemExit('Invalid preview payload')
          key = pathlib.Path('/opt/actions-runner/.ssh/checkupauto_planethoster_ed25519')
          hosts = pathlib.Path('/opt/actions-runner/.ssh/planethoster_known_hosts')
          for path in (key, hosts):
              if path.is_symlink() or not path.is_file() or stat.S_IMODE(path.stat().st_mode) not in (0o400, 0o600):
                  raise SystemExit('Dedicated staging SSH material unavailable or unsafe')
          ssh = ['ssh', '-p', '5022', '-i', str(key), '-o', 'BatchMode=yes',
                 '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=12',
                 '-o', 'StrictHostKeyChecking=yes', '-o', 'UserKnownHostsFile=' + str(hosts),
                 'eqcrhuya@nodels49-eu.n0c.com']
          # Python 3.6-compatible remote diagnostic; never reads application config.
          diagnostic = r'''
          import glob, json, os, shutil, subprocess
          candidates = [shutil.which('python3')] + glob.glob('/opt/alt/python*/bin/python3*') + glob.glob('/opt/alt/python*/usr/bin/python3*')
          results = []
          for path in sorted(set(p for p in candidates if p))[:20]:
              if os.path.isfile(path) and os.access(path, os.X_OK) and not path.endswith(('config', '.py')):
                  try:
                      proc = subprocess.run([path, '--version'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=3)
                      results.append({'path': path, 'version': proc.stdout.decode('utf-8', 'replace').strip()[:120]})
                  except Exception:
                      pass
          print(json.dumps({'pythonCandidates': results, 'passengerCommandDetected': bool(shutil.which('passenger') or shutil.which('passenger-config')), 'stagingDirectoryExists': os.path.isdir(os.path.expanduser('~/test-v3.checkupauto.fr'))}))
          '''
          remote = subprocess.run(ssh + ['python3 -c ' + shlex.quote(diagnostic)], capture_output=True, timeout=45)
          if remote.returncode:
              raise SystemExit('Staging SSH diagnostic failed; no public preview was written')
          print('STAGING_DIAGNOSTIC ' + remote.stdout.decode('utf-8', 'replace').strip())
          # Create exactly one self-contained HTML file in a dedicated subdirectory.
          # Refuse symlinks and never overwrite a file containing different bytes.
          publish = r'''
          import hashlib, json, os, pathlib, re, sys, tempfile
          sha, digest = sys.argv[1:3]
          if not re.fullmatch('[0-9a-f]{40}', sha) or not re.fullmatch('[0-9a-f]{64}', digest):
              raise SystemExit('invalid evidence')
          body = sys.stdin.buffer.read(6 * 1024 * 1024 + 1)
          if len(body) > 6 * 1024 * 1024 or hashlib.sha256(body).hexdigest() != digest:
              raise SystemExit('invalid payload')
          home = pathlib.Path.home().resolve()
          webroot = home / 'test-v3.checkupauto.fr'
          if webroot.is_symlink() or not webroot.is_dir() or webroot.resolve().parent != home:
              raise SystemExit('staging document root must already exist and be isolated')
          directory = webroot / 'demo-preview'
          if directory.is_symlink():
              raise SystemExit('unsafe preview directory')
          directory.mkdir(mode=0o755, exist_ok=True)
          if directory.resolve().parent != webroot:
              raise SystemExit('unsafe preview directory')
          target = directory / ('index-' + sha + '.html')
          if target.is_symlink():
              raise SystemExit('unsafe preview target')
          if target.exists():
              if hashlib.sha256(target.read_bytes()).hexdigest() != digest:
                  raise SystemExit('refusing to overwrite a different preview')
          else:
              fd, temporary = tempfile.mkstemp(prefix='.incoming-preview-', dir=str(directory))
              try:
                  with os.fdopen(fd, 'wb') as handle:
                      handle.write(body)
                      handle.flush()
                      os.fsync(handle.fileno())
                      os.fchmod(handle.fileno(), 0o644)
                  os.replace(temporary, str(target))
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)
          print(json.dumps({'published': True, 'sourceSha': sha, 'sha256': digest}))
          '''
          result = subprocess.run(ssh + ['python3 -c ' + shlex.quote(publish) + ' ' + sha + ' ' + digest], input=body, capture_output=True, timeout=60)
          if result.returncode:
              raise SystemExit('Isolated static preview publication failed')
          print(result.stdout.decode('utf-8', 'replace').strip())
          url = 'https://test-v3.checkupauto.fr/demo-preview/index-' + sha + '.html'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          try:
              addresses = sorted({row[4][0] for row in socket.getaddrinfo('test-v3.checkupauto.fr', 443)})
              print('PREVIEW_DNS ' + json.dumps(addresses[:8]))
              with opener.open(url, timeout=20) as response:
                  served = response.read(6 * 1024 * 1024 + 1)
                  if response.status != 200 or hashlib.sha256(served).hexdigest() != digest:
                      raise ValueError('preview_content_mismatch')
          except Exception as exc:
              print('PREVIEW_NOT_VERIFIED ' + type(exc).__name__ + ' ' + str(getattr(exc, 'code', '')))
              raise SystemExit('Static file exported and staged; HTTPS route still requires hosting configuration. Use the portable preview artifact.')
          print('VERIFIED_PREVIEW_URL ' + url)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Demonstration verified over HTTPS\n\n[Open the isolated CheckupAuto preview](' + url + ')\n\nNo real reservations, payments, customer data or notifications.\n')
          PY
