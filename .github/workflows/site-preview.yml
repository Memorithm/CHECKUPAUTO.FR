name: Isolated site preview

on:
  pull_request:
    paths: ['site_preview.py', 'site_preview_test.py', '.github/workflows/site-preview.yml', 'index.html', 'style.css', 'assets/**']
  push:
    branches: [main]
    paths: ['site_preview.py', 'site_preview_test.py', '.github/workflows/site-preview.yml', 'index.html', 'style.css', 'assets/**']

permissions:
  contents: read

concurrency:
  group: checkupauto-static-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    # Keep the repository on the already-provisioned internal runner. The output
    # path is initialized only after the runner starts, where RUNNER_TEMP exists.
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 4
    steps:
      - name: Refuse protected runners for pull request code
        if: github.event_name == 'pull_request'
        env:
          PROTECTED_RUNNERS: ${{ vars.CHECKUPAUTO_PROTECTED_RUNNERS }}
        run: |
          set -euo pipefail
          # Runs before checkout: pull request code never reaches a runner listed
          # in the CHECKUPAUTO_PROTECTED_RUNNERS repository variable.
          if [ -z "${PROTECTED_RUNNERS:-}" ]; then
            echo "::warning::CHECKUPAUTO_PROTECTED_RUNNERS is not set; protected runner guard inactive"
            exit 0
          fi
          IFS=',' read -r -a protected <<< "$PROTECTED_RUNNERS"
          for name in "${protected[@]}"; do
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            if [ -n "$name" ] && [ "$RUNNER_NAME" = "$name" ]; then
              echo "::error::Pull request jobs must not run on protected runner $RUNNER_NAME"
              exit 1
            fi
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test and export only the visual frontend
        run: |
          set -euo pipefail
          PREVIEW_OUT="$(mktemp -d "$RUNNER_TEMP/checkupauto-preview.XXXXXX")/export"
          export PREVIEW_OUT
          echo "PREVIEW_OUT=$PREVIEW_OUT" >> "$GITHUB_ENV"
          python3 -m unittest site_preview_test
          python3 -c 'import site_preview; print(site_preview.PREVIEW_JS)' | node --check
          python3 site_preview.py --sha "$(git rev-parse HEAD)" --output "$PREVIEW_OUT"
      - name: Save the portable preview, never the repository or runtime state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkupauto-visual-preview
          path: |
            ${{ env.PREVIEW_OUT }}/index.html
            ${{ env.PREVIEW_OUT }}/preview.json
          if-no-files-found: error
          retention-days: 14
