name: Security CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Create isolated Python test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Python unit tests
        run: .ci-venv/bin/python -m unittest discover -p '*_test.py'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin/admin.js
          node --check admin/mfa.js
          node --check admin/control-center.js
          node --check admin/gsc-admin.js
          node --check admin/readiness.js
          node --check admin/deployment.js
          node --check admin/integrations.js
          node --check admin/referrals.js
          node --check admin/notifications.js
          node --check admin/competitive.js
          node --check admin/review-followup.js
      - name: Verify no runtime-private paths are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(private/|\.admin-password$|\.env($|\.)|.*\.(sqlite3?|db|log)$)'
