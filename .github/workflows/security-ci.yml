name: Security CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Create isolated Python test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare isolated runtime data
        run: |
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/checkupauto-security-ci.XXXXXX")"
          chmod 700 "$runtime_dir"
          printf 'CYBERCHECK_DATA_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
      - name: Run Python unit tests
        run: .ci-venv/bin/python -m unittest discover -p '*_test.py'
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Verify no runtime-private paths are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(private/|\.admin-password$|\.env($|\.)|.*\.(sqlite3?|db|log)$)'
      - name: Clean isolated runtime data
        if: always()
        run: |
          if [ -n "${CYBERCHECK_DATA_DIR:-}" ]; then
            rm -rf "$CYBERCHECK_DATA_DIR"
          fi
