name: Security CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pull request code runs on ephemeral GitHub-hosted runners, never on the
    # self-hosted fleet that shares labels with the production deploy runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","internal"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Create isolated Python test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static analysis (ruff, syntax errors and undefined names)
        run: |
          .ci-venv/bin/python -m pip install --disable-pip-version-check ruff==0.17.0
          .ci-venv/bin/ruff check .
      - name: Prepare isolated runtime data
        run: |
          test -d /dev/shm && test -w /dev/shm
          runtime_dir="$(mktemp -d /dev/shm/checkupauto-security-ci.XXXXXX)"
          chmod 700 "$runtime_dir"
          mkdir -m 700 "$runtime_dir/data" "$runtime_dir/private" "$runtime_dir/security" "$runtime_dir/integrity" "$runtime_dir/tmp"
          printf '%s\n' 'ci-only-fixture-password' > "$runtime_dir/private/admin-password"
          chmod 600 "$runtime_dir/private/admin-password"
          printf 'CYBERCHECK_CI_RUNTIME_ROOT=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
          printf 'CYBERCHECK_DATA_DIR=%s\n' "$runtime_dir/data" >> "$GITHUB_ENV"
          printf 'CYBERCHECK_PRIVATE_DIR=%s\n' "$runtime_dir/private" >> "$GITHUB_ENV"
          printf 'CYBERCHECK_SECURITY_DIR=%s\n' "$runtime_dir/security" >> "$GITHUB_ENV"
          printf 'CYBERCHECK_INTEGRITY_DIR=%s\n' "$runtime_dir/integrity" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$runtime_dir/tmp" >> "$GITHUB_ENV"
      - name: Run Python unit tests
        run: |
          .ci-venv/bin/python -c "import faulthandler,unittest; faulthandler.dump_traceback_later(120,repeat=True); unittest.main(module=None,argv=['unittest','discover','-v','-p','*_test.py'])"
      - name: Verify CGV file imports
        run: node --test admin/terms-file.test.js
      - name: Verify browser-side public asset cache safety
        run: node --test assets/public-asset-cache.test.mjs
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Verify no runtime-private paths are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(private/|\.admin-password$|\.env($|\.)|.*\.(sqlite3?|db|log)$)'
      - name: Clean isolated runtime data
        if: always()
        run: |
          if [ -n "${CYBERCHECK_CI_RUNTIME_ROOT:-}" ]; then
            case "$CYBERCHECK_CI_RUNTIME_ROOT" in /dev/shm/checkupauto-security-ci.*) rm -rf "$CYBERCHECK_CI_RUNTIME_ROOT" ;; *) exit 1 ;; esac
          fi

