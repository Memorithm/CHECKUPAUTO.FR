name: Security CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            admin_server.py analytics_store.py app_download.py app_download_test.py \
            booking_bridge.py booking_test.py email_gateway.py email_gateway_test.py geo_marketing.py \
            gsc_client.py integration_hub.py mercure_admin_client.py mercure_public_client.py \
            referral_engine.py referral_engine_test.py referral_booking_test.py \
            reminder_engine.py reminder_engine_test.py review_followup.py review_followup_policy_test.py \
            security_ai.py security_alerts.py security_behavior.py security_guard.py security_integrity.py
      - name: Run focused unit tests
        run: |
          python3 -m unittest \
            app_download_test.py email_gateway_test.py review_followup_policy_test.py integration_hub_test.py \
            referral_engine_test.py referral_booking_test.py reminder_engine_test.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin/admin.js
          node --check admin/control-center.js
          node --check admin/gsc-admin.js
          node --check admin/integrations.js
          node --check admin/referrals.js
          node --check admin/competitive.js
          node --check admin/review-followup.js
      - name: Verify no runtime-private paths are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(private/|\.admin-password$|\.env($|\.)|.*\.(sqlite3?|db|log)$)'
