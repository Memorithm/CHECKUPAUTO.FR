name: Wire payment contract editor on feature branch
on:
  push:
    branches: ['feat/payline-contract-backoffice']
    paths: ['.github/workflows/payments-contract-wire.yml']
permissions:
  contents: write
jobs:
  wire:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR' && github.ref == 'refs/heads/feat/payline-contract-backoffice'
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply only the reviewed source and menu insertions
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          expected = {
              'admin_server.py': 'bad45495f323d12ef6cd5c284578b4772bcdd0b0',
              'admin/index.html': 'a2a4ea70a03e911999f0702d98f9a2e29026b4e8',
          }
          sources = {}
          for name, digest in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != digest:
                  raise SystemExit('Reviewed source has changed: ' + name)
              sources[name] = raw.decode('utf-8')
          source = sources['admin_server.py']
          anchor = 'import compliance_admin_http as compliance_admin_http\n'
          if source.count(anchor) != 1:
              raise SystemExit('Import anchor is not unique')
          source = source.replace(anchor, anchor + 'import payment_contract_http\n', 1)
          for method in ('do_GET', 'do_POST'):
              anchor = ' def ' + method + '(self):\n  if not self._guard(): return\n'
              if source.count(anchor) != 1:
                  raise SystemExit('Guard anchor is not unique: ' + method)
              source = source.replace(anchor, anchor + '  if payment_contract_http.handle(self,secret=PASSWORD): return\n', 1)
          ast.parse(source)
          menu = sources['admin/index.html']
          anchor = '<a href="#compliance">Conformité RGPD & ventes</a>'
          if menu.count(anchor) != 1:
              raise SystemExit('Menu anchor is not unique')
          menu = menu.replace(anchor, '<a href="/admin/payments.html">Paiements</a>' + anchor, 1)
          Path('admin_server.py').write_text(source, encoding='utf-8')
          Path('admin/index.html').write_text(menu, encoding='utf-8')
          print('Exactly three backend insertions and one menu link prepared.')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- admin_server.py admin/index.html
          git commit -m 'feat: wire the authenticated payment contract menu and routes'
          git push origin HEAD:refs/heads/feat/payline-contract-backoffice
