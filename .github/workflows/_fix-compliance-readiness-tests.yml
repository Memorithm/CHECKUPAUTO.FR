name: Temporary compliance readiness test fix

on:
  push:
    branches:
      - feat/compliance-production-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Align legacy readiness fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('production_readiness_test.py')
          source = path.read_text(encoding='utf-8')
          old = '''    def test_ios_release_preflight_surfaces_repository_mismatch(self):\n        patches = healthy_patches()\n        patches[-1] = mock.patch.object(readiness.ios_release_preflight, "status", return_value={\n'''
          new = '''    def test_ios_release_preflight_surfaces_repository_mismatch(self):\n        patches = healthy_patches()\n        patches[13] = mock.patch.object(readiness.ios_release_preflight, "status", return_value={\n'''
          if source.count(old) != 1:
              raise SystemExit('iOS readiness fixture anchor changed')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          path = Path('production_readiness_quarantine_test.py')
          source = path.read_text(encoding='utf-8')
          anchor = '''        mock.patch.object(readiness.security_alerts, "summary", return_value={\n            "open": 0,\n            "undeliveredHighOrCritical": 0,\n            "delivery": {\n                "configured": True,\n                "ready": True,\n                "state": "ready",\n                "signed": True,\n                "endpointHost": "alerts.example.test",\n            },\n        }),\n    ]\n'''
          replacement = '''        mock.patch.object(readiness.security_alerts, "summary", return_value={\n            "open": 0,\n            "undeliveredHighOrCritical": 0,\n            "delivery": {\n                "configured": True,\n                "ready": True,\n                "state": "ready",\n                "signed": True,\n                "endpointHost": "alerts.example.test",\n            },\n        }),\n        mock.patch.object(readiness.compliance_admin, "snapshot", return_value={\n            "summary": {\n                "readyForPublicContracting": True,\n                "operationalRegistersReady": True,\n                "identityComplete": True,\n                "publishedDocuments": 4,\n                "requiredDocuments": 4,\n                "checkoutAcceptanceBound": True,\n                "withdrawalFunctionBound": True,\n                "overdueRightsRequests": 0,\n                "overdueIncidentNotifications": 0,\n                "operationalBlockers": [],\n            },\n        }),\n    ]\n'''
          if 'readiness.compliance_admin' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('quarantine fixture anchor changed')
              source = source.replace(anchor, replacement, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git rm .github/workflows/_fix-compliance-readiness-tests.yml
          git config user.name "CHECKUPAUTO"
          git config user.email "contact@checkupauto.fr"
          git add production_readiness_test.py production_readiness_quarantine_test.py
          git diff --cached --check
          git commit -m "test: align readiness fixtures with compliance gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
