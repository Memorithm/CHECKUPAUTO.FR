name: Temporary admin rights dispatch patch

on:
  push:
    branches: [feat/admin-rights-dispatch-http]
    paths:
      - 'scripts/tmp_patch_admin_rights_dispatch.py'
      - '.github/workflows/tmp-patch-admin-rights-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/admin-rights-dispatch-http
      - name: Create isolated Python environment
        run: |
          python3 -m venv .tmp-rights-venv
          .tmp-rights-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply bounded source patch
        run: .tmp-rights-venv/bin/python scripts/tmp_patch_admin_rights_dispatch.py
      - name: Compile changed boundary and tests
        run: .tmp-rights-venv/bin/python -m py_compile admin_server.py rights_execution_dispatch.py admin_rights_dispatch_api_test.py
      - name: Run targeted rights dispatch tests
        run: .tmp-rights-venv/bin/python -m unittest rights_execution_dispatch_test.py admin_rights_dispatch_api_test.py
      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "admin_server.py"
      - name: Commit bounded server change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin_server.py
          test "$(git diff --cached --name-only)" = "admin_server.py"
          git commit -m 'feat: route admin rights execution through typed dispatch'
          git push origin HEAD:feat/admin-rights-dispatch-http
