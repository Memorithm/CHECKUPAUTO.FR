name: iOS TestFlight Delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/CheckupAutoReminder/**'
      - 'ios_release_runner.py'
      - 'scripts/install-appstore-team-key.sh'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  group: ios-testflight-delivery
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 45
    env:
      CHECKUPAUTO_MAC_HOST: Mac-mini-de-tarek.local
      CHECKUPAUTO_MAC_USER: tarek
      CHECKUPAUTO_APPLE_TEAM_ID: ${{ secrets.CHECKUPAUTO_APPLE_TEAM_ID }}
      CHECKUPAUTO_ASC_KEY_ID: ${{ secrets.CHECKUPAUTO_ASC_KEY_ID }}
      CHECKUPAUTO_ASC_ISSUER_ID: ${{ secrets.CHECKUPAUTO_ASC_ISSUER_ID }}
      CHECKUPAUTO_ASC_KEY_P8: ${{ secrets.CHECKUPAUTO_ASC_KEY_P8 }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Require canonical main release
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::TestFlight delivery must run from main"
            exit 2
          }

          asc_parts=0
          [ -n "${CHECKUPAUTO_ASC_KEY_ID:-}" ] && asc_parts=$((asc_parts + 1))
          [ -n "${CHECKUPAUTO_ASC_ISSUER_ID:-}" ] && asc_parts=$((asc_parts + 1))
          [ -n "${CHECKUPAUTO_ASC_KEY_P8:-}" ] && asc_parts=$((asc_parts + 1))
          if [ "$asc_parts" -ne 0 ] && [ "$asc_parts" -ne 3 ]; then
            echo "::error::App Store Connect API credentials are partially configured"
            exit 2
          fi
          if [ -n "${CHECKUPAUTO_APPLE_TEAM_ID:-}" ] &&
             ! [[ "$CHECKUPAUTO_APPLE_TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "::error::CHECKUPAUTO_APPLE_TEAM_ID is invalid"
            exit 2
          fi

          git checkout -B main "$GITHUB_SHA"
          git update-ref refs/remotes/origin/main "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Resolve authorized Mac SSH identity
        env:
          CHECKUPAUTO_MAC_SSH_KEY: ${{ secrets.CHECKUPAUTO_MAC_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/checkupauto-testflight-mac-key"
          auth="$RUNNER_TEMP/checkupauto-testflight-auth"
          rm -f "$key" "$auth"
          umask 077

          verify_key() {
            candidate="$1"
            [ -r "$candidate" ] || return 1
            timeout 3 ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || return 1
            timeout 8 ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes               -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new               "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1
          }

          if [ -n "${CHECKUPAUTO_MAC_SSH_KEY:-}" ]; then
            printf '%s\n' "$CHECKUPAUTO_MAC_SSH_KEY" > "$key"
            if verify_key "$key"; then
              printf '%s\n' key > "$auth"
            else
              rm -f "$key"
            fi
          fi

          if [ ! -s "$auth" ] && timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5             -o StrictHostKeyChecking=accept-new             "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1; then
            printf '%s\n' default > "$auth"
          fi

          if [ ! -s "$auth" ]; then
            for candidate in               /root/.ssh/checkupauto_macmini_ed25519               "$HOME/.ssh/checkupauto_macmini_ed25519"               /opt/actions-runner/.ssh/checkupauto_macmini_ed25519               /root/.ssh/remoteops_thor_ed25519               "$HOME/.ssh/remoteops_thor_ed25519"               /opt/actions-runner/.ssh/remoteops_thor_ed25519               /root/.ssh/id_ed25519               "$HOME/.ssh/id_ed25519"               /opt/actions-runner/.ssh/id_ed25519               /root/.ssh/id_rsa               "$HOME/.ssh/id_rsa"               /opt/actions-runner/.ssh/id_rsa; do
              if verify_key "$candidate"; then
                cp "$candidate" "$key"
                chmod 600 "$key"
                printf '%s\n' key > "$auth"
                break
              fi
            done
          fi

          [ -s "$auth" ] || {
            echo "::error::No authorized Mac mini SSH identity is available"
            exit 2
          }
          printf '%s\n' "$auth" > "$RUNNER_TEMP/checkupauto-testflight-auth-path"
          if [ -s "$key" ]; then
            printf '%s\n' "$key" > "$RUNNER_TEMP/checkupauto-testflight-key-path"
          fi

      - name: Stage exact GitHub source on Mac mini
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi

          remote_dir="/tmp/checkupauto-testflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$remote_dir" > "$RUNNER_TEMP/checkupauto-testflight-remote-dir"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          tar -czf - --exclude='.build' --exclude='DerivedData' --exclude='*.xcodeproj' . |             ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               "tar -xzf - -C '$remote_dir'"

      - name: Resolve Apple signing and App Store Connect credentials
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi

          derived_team="$(
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          teams="$(
            { find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"                    "$HOME/Library/MobileDevice/Provisioning Profiles"                    -maxdepth 1 -type f 2>/dev/null || true; } |
            while IFS= read -r profile; do
              tmp="$(mktemp)"
              if security cms -D -i "$profile" >"$tmp" 2>/dev/null; then
                app_id="$(plutil -extract Entitlements.application-identifier raw -o - "$tmp" 2>/dev/null || true)"
                if [[ "$app_id" == *.fr.checkupauto.reminder ]]; then
                  plutil -extract TeamIdentifier.0 raw -o - "$tmp" 2>/dev/null || true
                fi
              fi
              rm -f "$tmp"
            done |
            grep -E '^[A-Z0-9]{10}$' |
            sort -u
          )"
          count="$(printf '%s\n' "$teams" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "$count" = "1" ] || exit 3
          printf '%s\n' "$teams"
          REMOTE
          )" || {
            echo "::error::Unable to resolve exactly one Checkup Auto provisioning Team ID"
            exit 2
          }

          if [ -n "${CHECKUPAUTO_APPLE_TEAM_ID:-}" ] &&
             [ "$CHECKUPAUTO_APPLE_TEAM_ID" != "$derived_team" ]; then
            echo "::error::Configured Apple Team ID does not match the Checkup Auto provisioning profile"
            exit 2
          fi

          remote_key=""
          key_id=""
          issuer_id=""
          key_source=""

          if [ -n "${CHECKUPAUTO_ASC_KEY_P8:-}" ]; then
            key_id="$CHECKUPAUTO_ASC_KEY_ID"
            issuer_id="$CHECKUPAUTO_ASC_ISSUER_ID"
            remote_key="/tmp/checkupauto-testflight-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p8"
            printf '%s\n' "$CHECKUPAUTO_ASC_KEY_P8" |               ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"                 "umask 077; cat > '$remote_key'; chmod 600 '$remote_key'"
            key_source="github"
          else
            local_state="$(
              ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            root="$HOME/Library/Application Support/CheckupAuto/AppStoreConnect"
            [ -d "$root" ] || exit 4
            mapfile_cmd=false
            keys="$(
              find "$root" -maxdepth 1 -type f -name 'AuthKey_*.p8' -print |
              sort
            )"
            count="$(printf '%s\n' "$keys" | sed '/^$/d' | wc -l | tr -d ' ')"
            [ "$count" = "1" ] || exit 5
            key_path="$(printf '%s\n' "$keys" | head -1)"
            key_name="$(basename "$key_path")"
            key_id="$(printf '%s\n' "$key_name" | sed -nE 's/^AuthKey_([A-Za-z0-9]{10})\.p8$/\1/p')"
            [ -n "$key_id" ] || exit 6
            issuer_file="$root/issuer-id"
            [ -f "$issuer_file" ] || exit 7
            issuer_id="$(tr -d '\r\n ' <"$issuer_file")"
            [[ "$issuer_id" =~ ^[0-9A-Fa-f-]{36}$ ]] || exit 8

            mode="$(stat -f '%Lp' "$key_path")"
            case "$mode" in
              400|600) ;;
              *) exit 9 ;;
            esac
            issuer_mode="$(stat -f '%Lp' "$issuer_file")"
            case "$issuer_mode" in
              400|600) ;;
              *) exit 10 ;;
            esac

            first_line="$(head -1 "$key_path")"
            [ "$first_line" = "-----BEGIN PRIVATE KEY-----" ] || exit 11
            printf '%s\t%s\t%s\n' "$key_id" "$issuer_id" "$key_path"
            REMOTE
            )" || {
              echo "::error::No usable App Store Connect Team API key is installed on the Mac mini"
              exit 2
            }
            IFS=$'\t' read -r key_id issuer_id remote_key <<<"$local_state"
            key_source="mac"
          fi

          [[ "$key_id" =~ ^[A-Za-z0-9]{10}$ ]] || {
            echo "::error::Resolved App Store Connect Key ID is invalid"
            exit 2
          }
          [[ "$issuer_id" =~ ^[0-9A-Fa-f-]{36}$ ]] || {
            echo "::error::Resolved App Store Connect Issuer ID is invalid"
            exit 2
          }

          umask 077
          printf '%s\n' "$derived_team" > "$RUNNER_TEMP/checkupauto-testflight-team-id"
          printf '%s\n' "$key_id" > "$RUNNER_TEMP/checkupauto-testflight-asc-key-id"
          printf '%s\n' "$issuer_id" > "$RUNNER_TEMP/checkupauto-testflight-asc-issuer-id"
          printf '%s\n' "$remote_key" > "$RUNNER_TEMP/checkupauto-testflight-remote-key-path"
          printf '%s\n' "$key_source" > "$RUNNER_TEMP/checkupauto-testflight-key-source"

      - name: Build, sign and upload to TestFlight
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi

          remote_dir="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-dir")"
          remote_key="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-key-path")"
          team_id="$(cat "$RUNNER_TEMP/checkupauto-testflight-team-id")"
          key_id="$(cat "$RUNNER_TEMP/checkupauto-testflight-asc-key-id")"
          issuer_id="$(cat "$RUNNER_TEMP/checkupauto-testflight-asc-issuer-id")"
          build_number="$(date -u +%y%m%d%H%M%S)"
          echo "CHECKUPAUTO_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "set -euo pipefail
             export PATH='/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
             cd '$remote_dir'
             export CHECKUPAUTO_RELEASE_PINNED_SHA='$GITHUB_SHA'
             export CHECKUPAUTO_BUILD_NUMBER='$build_number'
             export CHECKUPAUTO_APPLE_TEAM_ID='$team_id'
             export CHECKUPAUTO_ASC_KEY_ID='$key_id'
             export CHECKUPAUTO_ASC_ISSUER_ID='$issuer_id'
             export CHECKUPAUTO_ASC_KEY_PATH='$remote_key'
             python3 ios_release_runner.py testflight --allow-upload"

      - name: Clean temporary release material
        if: always()
        run: |
          set -u
          if [ -s "$RUNNER_TEMP/checkupauto-testflight-auth-path" ] &&
             [ -s "$RUNNER_TEMP/checkupauto-testflight-remote-dir" ]; then
            auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
            ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
            if [ "$(cat "$auth")" = key ] &&
               [ -s "$RUNNER_TEMP/checkupauto-testflight-key-path" ]; then
              ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
            fi
            remote_dir="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-dir")"
            remote_key=""
            key_source=""
            [ -s "$RUNNER_TEMP/checkupauto-testflight-remote-key-path" ] &&
              remote_key="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-key-path")"
            [ -s "$RUNNER_TEMP/checkupauto-testflight-key-source" ] &&
              key_source="$(cat "$RUNNER_TEMP/checkupauto-testflight-key-source")"
            if [ "$key_source" = "github" ] && [ -n "$remote_key" ]; then
              ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"                 "rm -rf '$remote_dir'; rm -f '$remote_key'" || true
            else
              ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"                 "rm -rf '$remote_dir'" || true
            fi
          fi

          if [ -s "$RUNNER_TEMP/checkupauto-testflight-key-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")"
          fi

          rm -f             "$RUNNER_TEMP/checkupauto-testflight-auth-path"             "$RUNNER_TEMP/checkupauto-testflight-key-path"             "$RUNNER_TEMP/checkupauto-testflight-remote-dir"             "$RUNNER_TEMP/checkupauto-testflight-team-id"             "$RUNNER_TEMP/checkupauto-testflight-asc-key-id"             "$RUNNER_TEMP/checkupauto-testflight-asc-issuer-id"             "$RUNNER_TEMP/checkupauto-testflight-remote-key-path"             "$RUNNER_TEMP/checkupauto-testflight-key-source"
