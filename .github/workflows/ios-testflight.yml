name: iOS TestFlight Delivery

# Deliver only after the exact iOS commit has passed BOTH Swift and Xcode CI.
# No upload from pull_request code or from an unfinished/failed build.
on:
  workflow_run:
    workflows: ['iOS Core CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-delivery
  cancel-in-progress: false

jobs:
  testflight:
    if: >-
      github.repository == 'Memorithm/CHECKUPAUTO.FR' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == 'CHECKUPAUTO') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha)
      )
    runs-on: [self-hosted, Linux, ARM64, internal, checkupauto-ci]
    timeout-minutes: 45
    env:
      CHECKUPAUTO_MAC_HOST: ${{ vars.CHECKUPAUTO_MAC_HOST || 'Mac-mini-de-tarek.local' }}
      CHECKUPAUTO_MAC_FALLBACK_IPV4: ${{ vars.CHECKUPAUTO_MAC_FALLBACK_IPV4 || '192.168.0.27' }}
      CHECKUPAUTO_MAC_SECONDARY_IPV4: ${{ vars.CHECKUPAUTO_MAC_SECONDARY_IPV4 || '192.168.0.17' }}
      CHECKUPAUTO_MAC_USER: tarek

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require canonical main release
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::TestFlight delivery must run from main"
            exit 2
          }
          # GITHUB_SHA on workflow_run is the default-branch revision; the
          # verified source commit is workflow_run.head_sha. Never upload an
          # untested or unrelated revision.
          expected="${{ github.event.workflow_run.head_sha || github.sha }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          git checkout -B main "$expected"
          git update-ref refs/remotes/origin/main "$expected"
          test -z "$(git status --porcelain)"
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION: (.*)$/\1/p' ios/CheckupAutoReminder/project.yml)"
          build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION: ([0-9]+)$/\1/p' ios/CheckupAutoReminder/project.yml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build" =~ ^[1-9][0-9]{0,3}$ ]]
          printf 'CHECKUPAUTO_RELEASE_BUILD=%s\n' "$build" >> "$GITHUB_ENV"
          echo "TESTFLIGHT_RELEASE_PINNED=$version ($build) sha=$expected"

      - name: Resolve reachable Mac mini SSH endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "TestFlight runner: $(hostname) / $(id -un)"
          original="$CHECKUPAUTO_MAC_HOST"
          selected=""
          for host in "$CHECKUPAUTO_MAC_HOST" "$CHECKUPAUTO_MAC_FALLBACK_IPV4" "$CHECKUPAUTO_MAC_SECONDARY_IPV4"; do
            [ -n "$host" ] || continue
            if [[ ! "$host" =~ ^[a-zA-Z0-9.-]{1,253}$ ]]; then
              echo "::error::Invalid Mac mini endpoint configuration"
              exit 2
            fi
            if timeout 5 bash -c 'exec 3<>/dev/tcp/"$1"/22' _ "$host" 2>/dev/null; then
              selected="$host"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::Mac mini SSH port 22 unreachable from this runner"
            exit 2
          fi
          if [ "$selected" != "$original" ]; then
            echo "::notice::Configured Mac mini hostname unreachable; using reachable LAN IPv4"
          fi
          printf 'CHECKUPAUTO_MAC_HOST=%s\n' "$selected" >> "$GITHUB_ENV"

      - name: Provision isolated runner SSH identity for Mac mini
        shell: bash
        run: |
          set -euo pipefail
          # The credential must be stored on the exact, previously diagnosed
          # CheckupAuto runner, not on an unrelated shared Linux machine.
          if [ "${RUNNER_NAME:-}" != "checkupauto-thor-arm64-02" ] ||
             [ "$(id -un)" != "memci-checkupauto" ]; then
            echo "::error::Unexpected runner identity for TestFlight key provisioning"
            exit 2
          fi
          bash scripts/ensure-mac-ssh-identity.sh "$HOME/.ssh"

      - name: Resolve authorized Mac SSH identity
        env:
          CHECKUPAUTO_MAC_SSH_KEY: ${{ secrets.CHECKUPAUTO_MAC_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/checkupauto-testflight-mac-key"
          auth="$RUNNER_TEMP/checkupauto-testflight-auth"
          rm -f "$key" "$auth"
          umask 077

          verify_key() {
            candidate="$1"
            [ -r "$candidate" ] || return 1
            timeout 3 ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || return 1
            timeout 8 ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes               -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new               "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1
          }

          if [ -n "${CHECKUPAUTO_MAC_SSH_KEY:-}" ]; then
            printf '%s\n' "$CHECKUPAUTO_MAC_SSH_KEY" > "$key"
            if verify_key "$key"; then
              printf '%s\n' key > "$auth"
            else
              rm -f "$key"
            fi
          fi

          if [ ! -s "$auth" ] && timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5             -o StrictHostKeyChecking=accept-new             "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1; then
            printf '%s\n' default > "$auth"
          fi

          if [ ! -s "$auth" ]; then
            for candidate in               /root/.ssh/checkupauto_macmini_ed25519               "$HOME/.ssh/checkupauto_macmini_ed25519"               /opt/actions-runner/.ssh/checkupauto_macmini_ed25519               /root/.ssh/remoteops_thor_ed25519               "$HOME/.ssh/remoteops_thor_ed25519"               /opt/actions-runner/.ssh/remoteops_thor_ed25519               /root/.ssh/id_ed25519               "$HOME/.ssh/id_ed25519"               /opt/actions-runner/.ssh/id_ed25519               /root/.ssh/id_rsa               "$HOME/.ssh/id_rsa"               /opt/actions-runner/.ssh/id_rsa; do
              if verify_key "$candidate"; then
                cp "$candidate" "$key"
                chmod 600 "$key"
                printf '%s\n' key > "$auth"
                break
              fi
            done
          fi

          [ -s "$auth" ] || {
            echo "::error::Mac SSH port reachable, but no authorized noninteractive SSH identity for this runner. Verify CHECKUPAUTO_MAC_SSH_KEY and the Mac authorized_keys."
            exit 2
          }
          printf '%s\n' "$auth" > "$RUNNER_TEMP/checkupauto-testflight-auth-path"
          if [ -s "$key" ]; then
            printf '%s\n' "$key" > "$RUNNER_TEMP/checkupauto-testflight-key-path"
          fi

      - name: Resolve Apple release state
        id: apple
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi

          state="$(
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               'bash -s' < scripts/checkupauto-testflight-credentials.sh
          )"

          while IFS='=' read -r name value; do
            case "$name" in
              ready|team_id|key_id|issuer_id|key_path)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$state"

      - name: Fail closed if Apple upload credentials are missing
        if: ${{ steps.apple.outputs.ready != 'true' }}
        run: |
          echo "TESTFLIGHT_BLOCKED_EXTERNAL=app-store-connect-team-key"
          echo "::error::The iOS build is not uploaded. Apple Team API key is missing from the Mac-local vault."
          {
            echo "### TestFlight DELIVERY FAILED"
            echo "The validated iOS source was NOT uploaded to App Store Connect."
            echo "Provision the App Store Connect Team API key in the Mac-local CheckupAuto vault via authorized RemoteOps."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Stage exact GitHub source on Mac mini
        if: ${{ steps.apple.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi
          remote_dir="/tmp/checkupauto-testflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$remote_dir" > "$RUNNER_TEMP/checkupauto-testflight-remote-dir"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          tar -czf - --exclude='.build' --exclude='DerivedData' --exclude='*.xcodeproj' . |             ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               "tar -xzf - -C '$remote_dir'"

      - name: Build, sign and upload to TestFlight
        if: ${{ steps.apple.outputs.ready == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ steps.apple.outputs.team_id }}
          ASC_KEY_ID: ${{ steps.apple.outputs.key_id }}
          ASC_ISSUER_ID: ${{ steps.apple.outputs.issuer_id }}
          ASC_KEY_PATH: ${{ steps.apple.outputs.key_path }}
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
          fi

          remote_dir="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-dir")"
          # Preserve the real marketing build identifier instead of uploading
          # a timestamp-derived build that cannot be matched to CI.
          build_number="$CHECKUPAUTO_RELEASE_BUILD"
          [[ "$build_number" =~ ^[1-9][0-9]{0,3}$ ]]
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "set -euo pipefail
             export PATH='/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
             cd '$remote_dir'
             export CHECKUPAUTO_RELEASE_PINNED_SHA='$GITHUB_SHA'
             export CHECKUPAUTO_BUILD_NUMBER='$build_number'
             export CHECKUPAUTO_APPLE_TEAM_ID='$APPLE_TEAM_ID'
             export CHECKUPAUTO_ASC_KEY_ID='$ASC_KEY_ID'
             export CHECKUPAUTO_ASC_ISSUER_ID='$ASC_ISSUER_ID'
             export CHECKUPAUTO_ASC_KEY_PATH='$ASC_KEY_PATH'
             python3 ios_release_runner.py testflight --allow-upload"

      - name: Clean temporary release material
        if: always()
        run: |
          set -u
          if [ -s "$RUNNER_TEMP/checkupauto-testflight-auth-path" ] &&
             [ -s "$RUNNER_TEMP/checkupauto-testflight-remote-dir" ]; then
            auth="$(cat "$RUNNER_TEMP/checkupauto-testflight-auth-path")"
            ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
            if [ "$(cat "$auth")" = key ] &&
               [ -s "$RUNNER_TEMP/checkupauto-testflight-key-path" ]; then
              ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")" -o IdentitiesOnly=yes)
            fi
            remote_dir="$(cat "$RUNNER_TEMP/checkupauto-testflight-remote-dir")"
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               "rm -rf '$remote_dir'" || true
          fi

          if [ -s "$RUNNER_TEMP/checkupauto-testflight-key-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/checkupauto-testflight-key-path")"
          fi
          rm -f             "$RUNNER_TEMP/checkupauto-testflight-auth-path"             "$RUNNER_TEMP/checkupauto-testflight-key-path"             "$RUNNER_TEMP/checkupauto-testflight-remote-dir"
