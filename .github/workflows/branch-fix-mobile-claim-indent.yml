name: Temporary mobile claim indentation fix

on:
  push:
    branches:
      - feat/mobile-claim-http-dispatch

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Repair and validate bounded admin route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin_server.py')
          source = path.read_text()
          if source.count('import mobile_claim_dispatch as mobile_claim_dispatch\n') != 1:
              raise SystemExit('typed dispatcher import missing or duplicated')
          start_marker = "  if path=='/api/mobile/claims/consume':\n"
          end_marker = "  if path=='/api/mobile/inventory':\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unexpected mobile claim route markers')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          new_block = '\n'.join([
              "  if path=='/api/mobile/claims/consume':",
              "   try:",
              "    ctype=(self.headers.get('Content-Type') or '').split(';',1)[0].strip().lower()",
              "    if ctype!='application/json': return self.send_json({'ok':False,'error':'content_type_not_allowed'},415)",
              "    result=mobile_claim_dispatch.consume_with_authoritative_refresh(self._read_json())",
              "    return self.send_json(result,200)",
              "   except PermissionError as exc: return self.send_json({'ok':False,'error':'mobile_request_forbidden'},403)",
              "   except Exception: return self.send_json({'ok':False,'error':'mobile_request_invalid'},400)",
              "",
          ])
          source = source[:start] + new_block + source[end:]
          path.write_text(source)
          PY
          python3 -m py_compile admin_server.py mobile_claim_dispatch.py
          python3 -m unittest mobile_claim_dispatch_test.py mobile_claim_api_test.py
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/branch-fix-mobile-claim-indent.yml
          git add admin_server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve mobile claim route indentation'
          git push origin HEAD:feat/mobile-claim-http-dispatch
