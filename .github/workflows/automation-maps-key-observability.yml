name: One-shot Maps Key Observability

on:
  push:
    branches:
      - automation/maps-key-observability-20260921

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/maps-key-observability-20260921
          persist-credentials: true
      - name: Apply deterministic status patch
        run: python3 scripts/apply-maps-key-observability.py
      - name: Compile patched sources
        run: python3 -m compileall -q integration_hub.py integration_hub_maps_key_policy_test.py
      - name: Create isolated test environment
        run: |
          python3 -m venv .patch-venv
          .patch-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Maps policy regressions
        run: .patch-venv/bin/python -m unittest integration_hub_maps_key_policy_test.py
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Remove one-shot automation files
        run: |
          git rm .github/workflows/automation-maps-key-observability.yml
          git rm scripts/apply-maps-key-observability.py
          rm -rf .patch-venv __pycache__
      - name: Commit observability change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration_hub.py integration_hub_maps_key_policy_test.py
          git diff --cached --check
          git commit -m 'fix: do not claim unverified Maps keys are connected'
          git push origin HEAD:automation/maps-key-observability-20260921
