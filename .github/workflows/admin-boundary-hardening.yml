name: Apply admin boundary hardening

on:
  push:
    branches:
      - automation/admin-boundary-hardening-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bound administration error diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('admin_server.py')
          lines = path.read_text().splitlines()
          codes = {
              "if path=='/api/admin/readiness':": 'readiness_unavailable',
              "if path=='/api/admin/referrals/accounts':": 'referral_admin_unavailable',
              "if path=='/api/admin/referrals/summary':": 'referral_summary_unavailable',
              "if path=='/api/admin/reminders/status':": 'reminder_status_unavailable',
              "if path=='/api/admin/reminders/plan':": 'reminder_plan_invalid',
              "if path=='/api/admin/mobile/devices/status':": 'mobile_status_unavailable',
              "if path=='/api/admin/mobile/claims/candidates':": 'mobile_claim_candidates_unavailable',
              "if path=='/api/admin/notifications/status':": 'notification_status_unavailable',
              "if path=='/api/admin/analytics':": 'analytics_summary_unavailable',
              "if path=='/api/admin/reviews/status':": 'review_status_unavailable',
              "if path=='/api/admin/competitive/summary':": 'competitive_summary_unavailable',
              "if path=='/api/admin/competitive/connectors':": 'competitive_connectors_unavailable',
              "if path=='/api/admin/security/status':": 'security_status_unavailable',
              "if path=='/api/admin/security/ai':": 'security_ai_unavailable',
              "if path=='/api/admin/security/posture':": 'security_posture_unavailable',
              "if path=='/api/admin/security/alerts':": 'security_alerts_unavailable',
              "if path=='/api/admin/security/sbom':": 'security_sbom_unavailable',
              "if path.startswith('/api/admin/mercure/'):": 'mercure_admin_request_failed',
              "if path=='/api/admin/mobile/claims/issue':": 'mobile_claim_request_invalid',
              "if path=='/api/admin/referrals/account':": 'referral_request_invalid',
              "if path=='/api/admin/referrals/redeem':": 'referral_request_invalid',
              "if path=='/api/admin/mercure/login':": 'mercure_login_failed',
              "if path=='/api/admin/booking-test/session':": 'booking_test_session_failed',
              "if path=='/api/admin/notifications/preflight':": 'notification_preflight_failed',
              "if path=='/api/admin/notifications/permanent/recipient-check':": 'recipient_check_unavailable',
              "if path=='/api/admin/notifications/permanent/retry':": 'recipient_retry_unavailable',
              "if path=='/api/admin/notifications/permanent/action':": 'permanent_failure_action_unavailable',
              "if path=='/api/admin/reminders/process':": 'reminder_process_failed',
              "if path=='/api/admin/reviews/process':": 'review_process_failed',
              "if path=='/api/admin/competitive/observation':": 'competitive_request_invalid',
              "if path=='/api/admin/competitive/review':": 'competitive_request_invalid',
              "if path=='/api/admin/security/alerts/ack':": 'security_alert_request_invalid',
              "if path=='/api/admin/security/vulnerability-refresh':": 'security_vulnerability_refresh_failed',
              "if path=='/api/admin/security/assess':": 'security_assessment_failed',
              "if path=='/api/admin/mercure/promo-slot':": 'mercure_promotion_invalid',
              "if path=='/api/admin/mercure/rotate-secret':": 'mercure_secret_rotation_failed',
              "if path!='/api/admin/config': return self.send_json({'error':'not_found'},404)": 'config_update_invalid',
          }
          special = {
              ("if path=='/api/admin/mobile/claims/issue':", 'LookupError'): 'mobile_claim_not_found',
              ("if path=='/api/admin/mobile/claims/issue':", 'RuntimeError'): 'mobile_claim_conflict',
              ("if path=='/api/admin/mercure/login':", 'PermissionError'): 'mercure_auth_failed',
              ("if path=='/api/admin/notifications/permanent/recipient-check':", 'LookupError'): 'permanent_failure_not_found',
              ("if path=='/api/admin/notifications/permanent/recipient-check':", 'ValueError'): 'recipient_check_invalid',
              ("if path=='/api/admin/notifications/permanent/retry':", 'LookupError'): 'permanent_failure_not_found',
              ("if path=='/api/admin/notifications/permanent/retry':", 'ValueError'): 'recipient_retry_invalid',
              ("if path=='/api/admin/notifications/permanent/action':", 'ValueError'): 'permanent_failure_action_invalid',
          }

          current = None
          mode = None
          changed = 0
          out = []
          for line in lines:
              if line.startswith(' def do_GET('): mode = 'GET'
              elif line.startswith(' def do_POST('): mode = 'POST'
              elif line.startswith(' def do_DELETE('): mode = 'DELETE'
              if line.startswith('  if ') and 'path' in line:
                  current = line.strip()
              if current in codes and 'except ' in line and 'return self.send_json' in line:
                  match = re.search(r'except\s+([A-Za-z_][A-Za-z0-9_]*)', line)
                  kind = match.group(1) if match else 'Exception'
                  code = special.get((current, kind), codes[current])
                  if mode == 'DELETE' and current == "if path=='/api/admin/mercure/promo-slot':":
                      code = 'mercure_promotion_delete_failed'
                  updated = line.replace("'error':str(exc)", f"'error':'{code}'")
                  updated = updated.replace("'error':type(exc).__name__", f"'error':'{code}'")
                  if updated != line:
                      line = updated
                      changed += 1
              out.append(line)

          if changed < 30:
              raise SystemExit(f'admin boundary patch unexpectedly small: {changed} replacements')
          path.write_text('\n'.join(out) + '\n')

          Path('admin_error_boundary_test.py').write_text('''from pathlib import Path\nimport unittest\n\n\nclass AdminErrorBoundaryTest(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.source = Path("admin_server.py").read_text()\n\n    def _block(self, start, end, offset=0):\n        begin = self.source.find(start, offset)\n        self.assertGreaterEqual(begin, 0, start)\n        finish = self.source.find(end, begin)\n        self.assertGreaterEqual(finish, 0, end)\n        return self.source[begin:finish]\n\n    def _bounded(self, block):\n        self.assertNotIn("'error':str(exc)", block)\n        self.assertNotIn("'error':type(exc).__name__", block)\n\n    def test_admin_get_boundaries_are_bounded(self):\n        core = self._block("  if path=='/api/admin/readiness':", "  if path=='/api/booking-test/status':")\n        mercure = self._block("  if path.startswith('/api/admin/mercure/'):", "  if path.startswith('/api/admin/google/'):", self.source.find(' def do_GET(self):'))\n        self._bounded(core); self._bounded(mercure)\n        for code in ('readiness_unavailable','referral_admin_unavailable','notification_status_unavailable','security_status_unavailable','mercure_admin_request_failed'):\n            self.assertIn(code, core + mercure)\n\n    def test_admin_post_boundaries_are_bounded(self):\n        post = self.source.find(' def do_POST(self):')\n        core = self._block("  if path=='/api/admin/mobile/claims/issue':", "  if path.startswith('/api/admin/google/'):", post)\n        config = self._block("  if path!='/api/admin/config':", " def do_DELETE(self):", post)\n        self._bounded(core); self._bounded(config)\n        for code in ('mobile_claim_not_found','referral_request_invalid','notification_preflight_failed','recipient_retry_unavailable','security_vulnerability_refresh_failed','mercure_secret_rotation_failed','config_update_invalid'):\n            self.assertIn(code, core + config)\n\n    def test_admin_delete_boundary_is_bounded(self):\n        delete = self.source.find(' def do_DELETE(self):')\n        block = self._block("  if path=='/api/admin/mercure/promo-slot':", "  return self.send_json({'error':'not_found'},404)", delete)\n        self._bounded(block)\n        self.assertIn('mercure_promotion_delete_failed', block)\n\n    def test_no_synthetic_sensitive_marker_is_embedded(self):\n        marker = 'sensitive-user@example.invalid:synthetic-token-marker'\n        self.assertNotIn(marker, self.source)\n        self.assertNotIn(marker, 'admin_request_failed')\n\n\nif __name__ == '__main__':\n    unittest.main()\n''')
          Path('.github/workflows/admin-boundary-hardening.yml').unlink()
          PY
      - name: Validate targeted patch
        run: |
          python3 -m unittest admin_error_boundary_test.py
          python3 -m py_compile admin_server.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound admin exception diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
