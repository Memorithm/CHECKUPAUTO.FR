name: Production deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character main commit SHA to deploy
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: checkupauto-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 10
    steps:
      - name: Validate signed main commit and Security CI
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          sha = os.environ["DEPLOY_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Deployment requires an exact 40-character lowercase commit SHA")

          api = os.environ["GH_API"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def get(path, query=None):
              url = f"{api}/repos/{repo}{path}"
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          branch = get("/branches/main")
          if (branch.get("commit") or {}).get("sha") != sha:
              raise SystemExit("Requested SHA is not the current GitHub main commit")

          commit = get(f"/commits/{sha}")
          verification = ((commit.get("commit") or {}).get("verification") or {})
          if verification.get("verified") is not True:
              raise SystemExit("Requested main commit is not signature-verified by GitHub")

          runs = get(
              "/actions/workflows/security-ci.yml/runs",
              {
                  "head_sha": sha,
                  "event": "push",
                  "status": "completed",
                  "per_page": 20,
              },
          ).get("workflow_runs") or []
          accepted = any(
              run.get("head_sha") == sha
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              for run in runs
          )
          if not accepted:
              raise SystemExit("No successful push Security CI exists for the requested main SHA")

          print(f"Deployment gate approved for {sha}")
          PY
      - name: Checkout approved main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Deploy current approved main commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: sudo -n /usr/local/sbin/cybercheck-deploy "$DEPLOY_SHA"
      - name: Verify canonical public CyberCheck surface
        run: python3 scripts/check-public-surface.py https://www.checkupauto.fr/
