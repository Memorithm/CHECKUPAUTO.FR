name: Production deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character main commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: checkupauto-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 10
    steps:
      - name: Validate requested commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Deployment requires an exact 40-character lowercase commit SHA." >&2
            exit 2
          }
      - name: Deploy current approved main commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: sudo -n /usr/local/sbin/cybercheck-deploy "$DEPLOY_SHA"
