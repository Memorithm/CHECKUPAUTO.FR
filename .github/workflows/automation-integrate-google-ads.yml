name: One-shot Google Ads Integration

on:
  push:
    branches:
      - automation/integrate-google-ads-probe-20260921

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/integrate-google-ads-probe-20260921
          persist-credentials: true
      - name: Apply deterministic IntegrationHub patch
        run: python3 scripts/apply-google-ads-integration.py
      - name: Compile patched sources
        run: python3 -m compileall -q integration_hub.py google_ads_probe.py integration_hub_google_ads_probe_test.py
      - name: Create isolated test environment
        run: |
          python3 -m venv .patch-venv
          .patch-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Google Ads regression tests
        run: |
          .patch-venv/bin/python -m unittest google_ads_probe_test.py integration_hub_google_ads_probe_test.py
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Remove one-shot automation files
        run: |
          git rm .github/workflows/automation-integrate-google-ads.yml
          git rm scripts/apply-google-ads-integration.py
          rm -rf .patch-venv __pycache__
      - name: Commit integrated runtime change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration_hub.py integration_hub_google_ads_probe_test.py
          git diff --cached --check
          git commit -m 'feat: actively verify Google Ads access in IntegrationHub'
          git push origin HEAD:automation/integrate-google-ads-probe-20260921
