name: Apply notification request readiness patch

on:
  push:
    branches:
      - fix/readiness-apns-request-failures

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('production_readiness.py')
          text = path.read_text()

          old = '''    "notification_broker": {\n        "code": "restore_notification_broker",\n        "summary": "Fermer les circuits défaillants, traiter les échecs permanents et rétablir un rapprochement Mercure récent.",\n        "verify": "Aucun circuit ouvert, aucun échec permanent actif et aucun contrôle destinataire périmé ou en échec.",\n'''
          new = '''    "notification_broker": {\n        "code": "restore_notification_broker",\n        "summary": "Fermer les circuits défaillants, traiter les échecs permanents ou de requête et rétablir un rapprochement Mercure récent.",\n        "verify": "Aucun circuit ouvert, aucun échec permanent ou de requête actif et aucun contrôle destinataire périmé ou en échec.",\n'''
          if old not in text:
              raise SystemExit('remediation anchor not found')
          text = text.replace(old, new, 1)

          old = '''        resilience = broker.get("resilience") or {}\n        circuits = int(resilience.get("circuitsOpen") or 0)\n        permanent_failures = int(resilience.get("permanentFailures") or 0)\n'''
          new = '''        resilience = broker.get("resilience") or {}\n        failure_counts = broker.get("failureCounts") or {}\n        circuits = int(resilience.get("circuitsOpen") or 0)\n        permanent_failures = int(resilience.get("permanentFailures") or 0)\n        request_failures = int(failure_counts.get("request") or 0)\n'''
          if old not in text:
              raise SystemExit('failure count anchor not found')
          text = text.replace(old, new, 1)

          old = '''        broker_degraded = circuits > 0 or permanent_failures > 0 or recipient_reconciliation_degraded\n        broker_issues = []\n        if circuits:\n            broker_issues.append(f"{circuits} circuit(s) ouvert(s)")\n        if permanent_failures:\n            broker_issues.append(f"{permanent_failures} échec(s) permanent(s) à traiter")\n'''
          new = '''        broker_degraded = (\n            circuits > 0 or permanent_failures > 0 or request_failures > 0 or recipient_reconciliation_degraded\n        )\n        broker_issues = []\n        if circuits:\n            broker_issues.append(f"{circuits} circuit(s) ouvert(s)")\n        if permanent_failures:\n            broker_issues.append(f"{permanent_failures} échec(s) permanent(s) à traiter")\n        if request_failures:\n            broker_issues.append(f"{request_failures} échec(s) de requête non retentable(s) à corriger")\n'''
          if old not in text:
              raise SystemExit('broker degraded anchor not found')
          text = text.replace(old, new, 1)

          old = '''                "circuitsOpen": circuits,\n                "permanentFailures": permanent_failures,\n                "permanentFailureHistory": permanent_history,\n'''
          new = '''                "circuitsOpen": circuits,\n                "permanentFailures": permanent_failures,\n                "requestFailures": request_failures,\n                "permanentFailureHistory": permanent_history,\n'''
          if old not in text:
              raise SystemExit('broker metrics anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('production_readiness_request_failure_test.py').write_text('''import unittest\nfrom unittest import mock\n\nimport production_readiness as readiness\nfrom production_readiness_test import CONFIG, SEO_READY, healthy_patches\n\n\nclass ProductionReadinessRequestFailureTest(unittest.TestCase):\n    def test_active_request_failure_degrades_critical_notification_broker(self):\n        patches = healthy_patches()\n        patches[1] = mock.patch.object(readiness.notification_broker, "status", return_value={\n            "channels": {\n                "email": {"configured": True, "transport": "gmail-api"},\n                "push": {"configured": True},\n            },\n            "failureCounts": {"request": 2},\n            "resilience": {\n                "circuitsOpen": 0,\n                "permanentFailures": 0,\n                "recipientChecks": {"tracked": 0, "fresh": 0, "stale": 0, "unchecked": 0, "lookupFailed": 0},\n            },\n        })\n        started = []\n        try:\n            for patcher in patches:\n                patcher.start()\n                started.append(patcher)\n            result = readiness.status(CONFIG, SEO_READY)\n        finally:\n            for patcher in reversed(started):\n                patcher.stop()\n\n        broker = next(item for item in result["components"] if item["id"] == "notification_broker")\n        self.assertEqual(broker["state"], "degraded")\n        self.assertEqual(broker["metrics"]["requestFailures"], 2)\n        self.assertIn("requête non retentable", broker["detail"])\n        self.assertFalse(result["activationGate"]["allowed"])\n        self.assertIn("notification_broker", result["criticalBlockers"])\n        self.assertEqual(broker["remediation"]["code"], "restore_notification_broker")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          Path('.github/workflows/autopatch-readiness-request.yml').unlink()
          PY
      - name: Validate focused readiness behavior
        shell: bash
        run: |
          python3 -m compileall -q production_readiness.py production_readiness_request_failure_test.py
          python3 -m unittest -q production_readiness_request_failure_test
          python3 scripts/precommit_security.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add -A
          git commit -m "fix: surface non-retryable notification request failures"
          git push origin HEAD
