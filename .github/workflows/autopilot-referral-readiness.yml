name: Autopilot Referral Readiness Patch

on:
  push:
    branches: [autopilot/referral-readiness-integrity]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: autopilot/referral-readiness-integrity
          persist-credentials: true
      - name: Patch referral integrity into Production Readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('production_readiness.py')
          text = path.read_text()

          replacements = [
              (
                  'import referral_engine\nimport reminder_dispatch\n',
                  'import referral_engine\nimport referral_integrity_audit\nimport reminder_dispatch\n',
                  'referral integrity import',
              ),
              (
                  '        "summary": "Rétablir le ledger de parrainage et vérifier la valeur de récompense configurée.",\n'
                  '        "verify": "Le ledger doit répondre sans erreur.",\n',
                  '        "summary": "Rétablir le ledger de parrainage et corriger toute anomalie d’intégrité comptable.",\n'
                  '        "verify": "Le ledger doit répondre et l’audit d’intégrité doit retourner issues=0.",\n',
                  'referral remediation',
              ),
              (
                  '    accounts, error = _safe("parrainage", lambda: referral_engine.list_accounts(100))\n'
                  '    if error:\n'
                  '        components.append(_failed("referrals", "Parrainage / cagnotte", False, error))\n'
                  '    else:\n'
                  '        components.append(_component(\n'
                  '            "referrals", "Parrainage / cagnotte", "ready", "Ledger de parrainage opérationnel",\n'
                  '            critical=False,\n'
                  '            metrics={"accounts": len(accounts), "rewardCents": referral_engine.configured_reward_cents()},\n'
                  '        ))\n',
                  '    referral_snapshot, error = _safe("parrainage", lambda: {\n'
                  '        "accounts": referral_engine.list_accounts(100),\n'
                  '        "integrity": referral_integrity_audit.status(),\n'
                  '    })\n'
                  '    if error:\n'
                  '        components.append(_failed("referrals", "Parrainage / cagnotte", False, error))\n'
                  '    else:\n'
                  '        accounts = referral_snapshot.get("accounts") or []\n'
                  '        integrity = referral_snapshot.get("integrity") or {}\n'
                  '        integrity_metrics = integrity.get("metrics") or {}\n'
                  '        integrity_issues = int(integrity.get("issues") or 0)\n'
                  '        integrity_ok = bool(integrity.get("ok")) and integrity_issues == 0\n'
                  '        components.append(_component(\n'
                  '            "referrals", "Parrainage / cagnotte", "ready" if integrity_ok else "degraded",\n'
                  '            "Ledger de parrainage opérationnel et cohérent" if integrity_ok else "Anomalies d’intégrité du ledger de parrainage",\n'
                  '            critical=False,\n'
                  '            metrics={\n'
                  '                "accounts": len(accounts),\n'
                  '                "rewardCents": referral_engine.configured_reward_cents(),\n'
                  '                "integrityIssues": integrity_issues,\n'
                  '                "accountsInDebt": int(integrity_metrics.get("accountsInDebt") or 0),\n'
                  '                "ambiguousLegacyReferences": int(integrity_metrics.get("ambiguousLegacyReferences") or 0),\n'
                  '                "missingEarns": int(integrity_metrics.get("missingEarns") or 0),\n'
                  '                "orphanEarns": int(integrity_metrics.get("orphanEarns") or 0),\n'
                  '                "amountMismatches": int(integrity_metrics.get("amountMismatches") or 0),\n'
                  '                "missingReversals": int(integrity_metrics.get("missingReversals") or 0),\n'
                  '                "orphanReversals": int(integrity_metrics.get("orphanReversals") or 0),\n'
                  '            },\n'
                  '        ))\n',
                  'referral readiness block',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('production_readiness_test.py')
          tests = test_path.read_text()
          old_runner = (
              '    def _run_with(self, patches, seo=SEO_READY):\n'
              '        for patcher in patches:\n'
              '            patcher.start()\n'
              '            self.addCleanup(patcher.stop)\n'
              '        return readiness.status(CONFIG, seo)\n'
          )
          new_runner = (
              '    def _run_with(self, patches, seo=SEO_READY):\n'
              '        audit_patcher = mock.patch.object(readiness.referral_integrity_audit, "status", return_value={\n'
              '            "ok": True, "state": "ready", "issues": 0, "metrics": {"accountsInDebt": 0},\n'
              '        })\n'
              '        audit_patcher.start()\n'
              '        self.addCleanup(audit_patcher.stop)\n'
              '        for patcher in patches:\n'
              '            patcher.start()\n'
              '            self.addCleanup(patcher.stop)\n'
              '        return readiness.status(CONFIG, seo)\n'
          )
          if tests.count(old_runner) != 1:
              raise SystemExit('test runner: expected exactly one match')
          tests = tests.replace(old_runner, new_runner, 1)

          marker = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          addition = '''\n\n    def test_referral_integrity_anomalies_are_visible_without_blocking_core_launch(self):\n        patches = healthy_patches()\n        patches.append(mock.patch.object(readiness.referral_integrity_audit, "status", return_value={\n            "ok": False,\n            "state": "degraded",\n            "issues": 4,\n            "metrics": {\n                "accountsInDebt": 1,\n                "ambiguousLegacyReferences": 1,\n                "missingEarns": 1,\n                "orphanEarns": 0,\n                "amountMismatches": 1,\n                "missingReversals": 1,\n                "orphanReversals": 0,\n            },\n        }))\n        result = self._run_with(patches)\n        referrals = next(item for item in result["components"] if item["id"] == "referrals")\n        self.assertEqual(referrals["state"], "degraded")\n        self.assertEqual(referrals["metrics"]["integrityIssues"], 4)\n        self.assertEqual(referrals["metrics"]["accountsInDebt"], 1)\n        self.assertEqual(referrals["metrics"]["ambiguousLegacyReferences"], 1)\n        self.assertEqual(referrals["remediation"]["code"], "restore_referrals")\n        self.assertTrue(result["activationGate"]["allowed"] )\n\n    def test_referral_integrity_probe_failure_is_bounded(self):\n        patches = healthy_patches()\n        patches.append(mock.patch.object(\n            readiness.referral_integrity_audit,\n            "status",\n            side_effect=readiness.referral_integrity_audit.ReferralAuditUnavailable("private-customer-token"),\n        ))\n        result = self._run_with(patches)\n        referrals = next(item for item in result["components"] if item["id"] == "referrals")\n        self.assertEqual(referrals["state"], "degraded")\n        encoded = json.dumps(result, sort_keys=True)\n        self.assertNotIn("private-customer-token", encoded)\n        self.assertIn("ReferralAuditUnavailable", encoded)\n'''
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker: expected exactly one match')
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)
          PY
      - name: Validate patch
        run: |
          set -euo pipefail
          python3 scripts/precommit_security.py
          python3 -m compileall -q production_readiness.py production_readiness_test.py referral_integrity_audit.py
          python3 -m venv .autopilot-venv
          .autopilot-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .autopilot-venv/bin/python -m unittest production_readiness_test referral_integrity_audit_test
          .autopilot-venv/bin/python -m unittest discover -p '*_test.py'
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add production_readiness.py production_readiness_test.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: surface referral ledger integrity in readiness'
          git push origin HEAD:autopilot/referral-readiness-integrity
