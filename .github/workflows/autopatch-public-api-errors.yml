name: Temporary public API error-boundary patch

on:
  push:
    branches:
      - autopilot/public-api-error-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: autopilot/public-api-error-boundary
      - name: Bound unexpected public API diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin_server.py')
          source = path.read_text()

          def replace_in_block(start, end, old, new):
              global source
              begin = source.find(start)
              if begin < 0:
                  raise SystemExit(f'missing start marker: {start}')
              finish = source.find(end, begin)
              if finish < 0:
                  raise SystemExit(f'missing end marker: {end}')
              block = source[begin:finish]
              if block.count(old) != 1:
                  raise SystemExit(f'expected exactly one target in {start!r}, found {block.count(old)}')
              block = block.replace(old, new, 1)
              source = source[:begin] + block + source[finish:]

          generic = "   except Exception as exc: return self.send_json({'ok':False,'error':str(exc)},400)"

          replace_in_block(
              "  if path=='/api/booking-test/status':",
              "  if path=='/api/booking/services':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'booking_test_status_unavailable'},400)",
          )
          replace_in_block(
              "  if path=='/api/geo/coverage':",
              "  if path=='/api/geo/quote':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'geo_coverage_unavailable'},400)",
          )
          replace_in_block(
              "  if path=='/api/geo/quote':",
              "  if path=='/api/booking/availability':",
              "   except Exception as exc: return self.send_json({'ok':False,'error':'Calcul géographique indisponible','detail':str(exc)},502)",
              "   except Exception: return self.send_json({'ok':False,'error':'geo_quote_unavailable'},502)",
          )
          replace_in_block(
              "  if path=='/api/booking/availability':",
              "  if path=='/go/app':",
              "   except Exception as exc: return self.send_json({'ok':False,'error':'Disponibilités temporairement indisponibles','detail':str(exc)},502)",
              "   except Exception: return self.send_json({'ok':False,'error':'booking_availability_unavailable'},502)",
          )
          replace_in_block(
              "  if path=='/go/booking':",
              "  if path.startswith('/api/admin/mercure/'):",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'booking_request_failed'},400)",
          )
          replace_in_block(
              "  if path=='/api/mobile/bootstrap':",
              "  if path=='/api/admin/config':",
              "   except Exception as exc: return self.send_json({'ok':False,'error':'Configuration mobile indisponible','detail':str(exc)},500)",
              "   except Exception: return self.send_json({'ok':False,'error':'mobile_bootstrap_unavailable'},500)",
          )

          replace_in_block(
              "  if path=='/api/integrations/mercure/browser-confirmed':",
              "  if path=='/api/integrations/mercure/booking-confirmed':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'mercure_browser_confirmation_invalid'},400)",
          )
          replace_in_block(
              "  if path=='/api/integrations/mercure/booking-confirmed':",
              "  if path=='/api/mobile/installations/register':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'mercure_booking_confirmation_invalid'},400)",
          )

          mobile_routes = [
              ('/api/mobile/installations/register', '/api/mobile/installations/delete'),
              ('/api/mobile/installations/delete', '/api/mobile/devices/register'),
              ('/api/mobile/devices/register', '/api/mobile/devices/unregister'),
              ('/api/mobile/devices/unregister', '/api/mobile/claims/consume'),
              ('/api/mobile/claims/consume', '/api/mobile/inventory'),
              ('/api/mobile/inventory', '/api/mobile/reminders/sync'),
              ('/api/mobile/reminders/sync', '/api/events'),
          ]
          for route, next_route in mobile_routes:
              replace_in_block(
                  f"  if path=='{route}':",
                  f"  if path=='{next_route}':",
                  generic,
                  "   except Exception: return self.send_json({'ok':False,'error':'mobile_request_invalid'},400)",
              )

          replace_in_block(
              "  if path=='/api/events':",
              "  if path=='/api/booking-test/create':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'analytics_event_invalid'},400)",
          )
          replace_in_block(
              "  if path=='/api/booking-test/create':",
              "  if path=='/api/booking-test/remove':",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'booking_test_request_invalid'},400)",
          )
          replace_in_block(
              "  if path=='/api/booking-test/remove':",
              "  if path.startswith('/api/admin/'):",
              generic,
              "   except Exception: return self.send_json({'ok':False,'error':'booking_test_request_invalid'},400)",
          )

          path.write_text(source)
          PY

          cat > admin_public_error_sanitization_test.py <<'PY'
          from pathlib import Path
          import unittest


          class AdminPublicErrorSanitizationTest(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.source = Path('admin_server.py').read_text()

              def _block(self, start, end, offset=0):
                  begin = self.source.find(start, offset)
                  self.assertGreaterEqual(begin, 0, start)
                  finish = self.source.find(end, begin)
                  self.assertGreaterEqual(finish, 0, end)
                  return self.source[begin:finish]

              def _assert_bounded(self, start, end, code, offset=0):
                  block = self._block(start, end, offset)
                  self.assertIn(code, block)
                  self.assertNotIn("except Exception as exc: return self.send_json({'ok':False,'error':str(exc)}", block)
                  self.assertNotIn("'detail':str(exc)", block)

              def test_public_get_unexpected_failures_use_bounded_codes(self):
                  cases = [
                      ("  if path=='/api/booking-test/status':", "  if path=='/api/booking/services':", 'booking_test_status_unavailable'),
                      ("  if path=='/api/geo/coverage':", "  if path=='/api/geo/quote':", 'geo_coverage_unavailable'),
                      ("  if path=='/api/geo/quote':", "  if path=='/api/booking/availability':", 'geo_quote_unavailable'),
                      ("  if path=='/api/booking/availability':", "  if path=='/go/app':", 'booking_availability_unavailable'),
                      ("  if path=='/go/booking':", "  if path.startswith('/api/admin/mercure/'):", 'booking_request_failed'),
                      ("  if path=='/api/mobile/bootstrap':", "  if path=='/api/admin/config':", 'mobile_bootstrap_unavailable'),
                  ]
                  for start, end, code in cases:
                      with self.subTest(code=code):
                          self._assert_bounded(start, end, code)

              def test_public_post_unexpected_failures_use_bounded_codes(self):
                  post = self.source.find(' def do_POST(self):')
                  self.assertGreaterEqual(post, 0)
                  cases = [
                      ("  if path=='/api/integrations/mercure/browser-confirmed':", "  if path=='/api/integrations/mercure/booking-confirmed':", 'mercure_browser_confirmation_invalid'),
                      ("  if path=='/api/integrations/mercure/booking-confirmed':", "  if path=='/api/mobile/installations/register':", 'mercure_booking_confirmation_invalid'),
                      ("  if path=='/api/mobile/installations/register':", "  if path=='/api/mobile/installations/delete':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/installations/delete':", "  if path=='/api/mobile/devices/register':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/devices/register':", "  if path=='/api/mobile/devices/unregister':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/devices/unregister':", "  if path=='/api/mobile/claims/consume':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/claims/consume':", "  if path=='/api/mobile/inventory':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/inventory':", "  if path=='/api/mobile/reminders/sync':", 'mobile_request_invalid'),
                      ("  if path=='/api/mobile/reminders/sync':", "  if path=='/api/events':", 'mobile_request_invalid'),
                      ("  if path=='/api/events':", "  if path=='/api/booking-test/create':", 'analytics_event_invalid'),
                      ("  if path=='/api/booking-test/create':", "  if path=='/api/booking-test/remove':", 'booking_test_request_invalid'),
                      ("  if path=='/api/booking-test/remove':", "  if path.startswith('/api/admin/'):", 'booking_test_request_invalid'),
                  ]
                  for start, end, code in cases:
                      with self.subTest(code=code):
                          self._assert_bounded(start, end, code, post)

              def test_public_boundary_does_not_embed_synthetic_sensitive_marker(self):
                  marker = 'sensitive-user@example.invalid:synthetic-token-marker'
                  self.assertNotIn(marker, self.source)
                  self.assertNotIn(marker, 'booking_test_status_unavailable')
                  self.assertNotIn(marker, 'mobile_request_invalid')


          if __name__ == '__main__':
              unittest.main()
          PY

          python3 -m unittest admin_public_error_sanitization_test.py
          python3 -m compileall -q admin_server.py admin_public_error_sanitization_test.py
          python3 scripts/precommit_security.py
          git diff --check

          git config user.name 'CHECKUPAUTO'
          git config user.email 'contact@checkupauto.fr'
          git add admin_server.py admin_public_error_sanitization_test.py
          git rm .github/workflows/autopatch-public-api-errors.yml
          git commit -m 'fix: bound unexpected public API diagnostics'
          git push origin HEAD:autopilot/public-api-error-boundary
