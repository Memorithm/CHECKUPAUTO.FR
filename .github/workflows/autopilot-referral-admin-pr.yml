name: Autopilot Referral Admin Integrity Patch

on:
  push:
    branches:
      - autopilot/referral-admin-integrity

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: autopilot/referral-admin-integrity
          persist-credentials: true
      - name: Apply patch
        run: python3 scripts/autopilot_referral_admin_patch.py
      - name: Validate patch
        run: |
          set -euo pipefail
          python3 scripts/precommit_security.py
          python3 -m compileall -q referral_admin.py referral_admin_test.py admin_server.py
          node --check admin/referrals.js
          python3 -m venv .autopilot-venv
          .autopilot-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .autopilot-venv/bin/python -m unittest referral_admin_test
          .autopilot-venv/bin/python -m unittest discover -p '*_test.py'
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add admin_server.py admin/referrals.js
          if git diff --cached --quiet; then
            echo 'Patch already applied; no commit required.'
            exit 0
          fi
          git commit -m 'feat: surface referral ledger integrity in admin'
          git push origin HEAD:autopilot/referral-admin-integrity
