name: Apply IntegrationHub Web OAuth policy patch locally

on:
  push:
    branches:
      - automation/google-web-oauth-client

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/google-web-oauth-client
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/.automation_google_web_oauth_patch.py

      - name: Validate focused tests
        run: |
          python3 -m compileall -q integration_hub.py integration_hub_test.py integration_hub_web_oauth_policy_test.py
          python3 -m unittest integration_hub_test.py integration_hub_web_oauth_policy_test.py

      - name: Commit final branch state
        run: |
          set -euo pipefail
          rm .github/workflows/automation-google-web-oauth-patch.yml
          rm .github/workflows/automation-google-web-oauth-patch-local.yml
          rm scripts/.automation_google_web_oauth_patch.py
          git config user.name "CHECKUPAUTO Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: require web OAuth clients for IntegrationHub"
          git push origin HEAD:automation/google-web-oauth-client
