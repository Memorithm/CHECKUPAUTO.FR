name: Apply Google OAuth readiness patch

on:
  push:
    branches:
      - automation/google-oauth-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/google-oauth-readiness
          fetch-depth: 0

      - name: Apply readiness patch
        run: python3 scripts/.automation_google_oauth_readiness_patch.py

      - name: Validate focused readiness tests
        run: |
          python3 -m compileall -q production_readiness.py production_readiness_test.py
          python3 -m unittest production_readiness_test.py

      - name: Commit final branch state
        run: |
          set -euo pipefail
          rm .github/workflows/automation-google-oauth-readiness-patch.yml
          rm scripts/.automation_google_oauth_readiness_patch.py
          git config user.name "CHECKUPAUTO Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: surface unverified Google OAuth clients in readiness"
          git push origin HEAD:automation/google-oauth-readiness
