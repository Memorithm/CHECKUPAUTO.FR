name: Hostinger staging preflight

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'admin_server.py'
      - 'admin_server_runtime_test.py'
      - 'deploy/hostinger/**'
      - 'hostinger_staging_*_test.py'
      - 'public_redirect_test.py'
      - '.github/workflows/hostinger-staging-*.yml'

permissions:
  contents: read

jobs:
  verify:
    # This is a software-only preflight. Real Hostinger deployment remains
    # owned by RemoteOps and is not exercised by pull requests.
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 15
    steps:
      - name: Refuse protected runners for pull request code
        if: github.event_name == 'pull_request'
        env:
          PROTECTED_RUNNERS: ${{ vars.CHECKUPAUTO_PROTECTED_RUNNERS }}
        run: |
          set -euo pipefail
          # Runs before checkout: pull request code never reaches a runner listed
          # in the CHECKUPAUTO_PROTECTED_RUNNERS repository variable.
          if [ -z "${PROTECTED_RUNNERS:-}" ]; then
            echo "::warning::CHECKUPAUTO_PROTECTED_RUNNERS is not set; protected runner guard inactive"
            exit 0
          fi
          IFS=',' read -r -a protected <<< "$PROTECTED_RUNNERS"
          for name in "${protected[@]}"; do
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            if [ -n "$name" ] && [ "$RUNNER_NAME" = "$name" ]; then
              echo "::error::Pull request jobs must not run on protected runner $RUNNER_NAME"
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Python syntax and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q admin_server.py deploy
          python3 -m venv "$RUNNER_TEMP/checkupauto-preflight"
          "$RUNNER_TEMP/checkupauto-preflight/bin/pip" install --disable-pip-version-check --quiet -r requirements.txt
          "$RUNNER_TEMP/checkupauto-preflight/bin/python" -m unittest -v \
            admin_server_runtime_test.py \
            hostinger_staging_tls_readiness_test.py \
            hostinger_staging_control_plane_test.py \
            hostinger_staging_deployment_provenance_test.py \
            hostinger_staging_migration_import_test.py \
            hostinger_staging_migration_finalize_test.py \
            public_redirect_test.py
      - name: Validate Docker compose model
        shell: bash
        env:
          CHECKUPAUTO_STAGING_HOST: stage.179.198.210.187.sslip.io
          CHECKUPAUTO_IMAGE_TAG: preflight
        run: |
          set -euo pipefail
          compose_model="$RUNNER_TEMP/checkupauto-hostinger-compose.yml"
          redirect_model="$RUNNER_TEMP/checkupauto-public-redirect-compose.yml"
          docker compose -f deploy/hostinger/docker-compose.yml config >"$compose_model"
          grep -q 'checkupauto-staging-web' "$compose_model"
          grep -q 'stage.179.198.210.187.sslip.io' "$compose_model"
          docker compose -f deploy/hostinger/public-redirect.compose.yml config >"$redirect_model"
          echo "HOSTINGER_STAGING_PREFLIGHT_OK"
