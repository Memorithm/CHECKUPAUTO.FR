name: Temporary readiness recipient health patch

on:
  push:
    branches:
      - fix/readiness-recipient-reconciliation-health

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create isolated Python test environment
        run: |
          python3 -m venv .tmp-readiness-venv
          .tmp-readiness-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply guarded patch
        run: python3 scripts/tmp_patch_readiness_recipient_health.py
      - name: Run focused readiness tests
        run: .tmp-readiness-venv/bin/python -m unittest production_readiness_test.py production_readiness_recipient_freshness_test.py
      - name: Remove temporary patch machinery
        run: rm -rf .tmp-readiness-venv scripts/tmp_patch_readiness_recipient_health.py .github/workflows/tmp-readiness-recipient-health.yml
      - name: Commit validated patch
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          git diff --cached --check
          git commit -m 'fix: gate readiness on recipient reconciliation health'
          git push origin HEAD:fix/readiness-recipient-reconciliation-health
