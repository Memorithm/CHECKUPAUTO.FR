name: Temporary readiness recipient health patch

on:
  push:
    branches:
      - fix/readiness-recipient-reconciliation-health

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply guarded patch
        run: python scripts/tmp_patch_readiness_recipient_health.py
      - name: Run focused readiness tests
        run: python -m unittest production_readiness_test.py production_readiness_recipient_freshness_test.py
      - name: Remove temporary patch machinery
        run: rm scripts/tmp_patch_readiness_recipient_health.py .github/workflows/tmp-readiness-recipient-health.yml
      - name: Commit validated patch
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          git diff --cached --check
          git commit -m 'fix: gate readiness on recipient reconciliation health'
          git push origin HEAD:fix/readiness-recipient-reconciliation-health
