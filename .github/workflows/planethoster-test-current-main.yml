name: PlanetHoster deployment ownership contract

on:
  pull_request:
    paths:
      - '.github/workflows/planethoster-test-current-main.yml'
      - 'planethoster_current_main_control_plane_test.py'
      - 'planethoster_current_main_workflow_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/planethoster-test-current-main.yml'
      - 'planethoster_current_main_control_plane_test.py'
      - 'planethoster_current_main_workflow_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR'
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify PlanetHoster control ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 planethoster_current_main_control_plane_test.py
          python3 planethoster_current_main_workflow_test.py
          echo "PLANETHOSTER_DEPLOYMENT_OWNER=Memorithm/RemoteOps"
