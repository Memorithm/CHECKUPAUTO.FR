name: 3D Asset CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '3d/**'
      - 'assets/vehicle.png'
      - 'glb_contract.py'
      - 'glb_contract_test.py'
      - '.github/workflows/3d-asset-ci.yml'
  push:
    branches: [main]
    paths:
      - '3d/**'
      - 'assets/vehicle.png'
      - 'glb_contract.py'
      - 'glb_contract_test.py'
      - '.github/workflows/3d-asset-ci.yml'

permissions:
  contents: read

concurrency:
  group: checkupauto-3d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-glb:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate GLB contract tests
        run: python3 -m unittest glb_contract_test
      - name: Export repository Blender asset
        run: |
          set -euo pipefail
          blender_bin="$(command -v blender || true)"
          test -n "$blender_bin" || { echo "::error::Blender is not installed on the internal runner"; exit 2; }
          export_dir="$(mktemp -d "$RUNNER_TEMP/checkupauto-glb.XXXXXX")"
          echo "GLB_EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"
          export_path="$export_dir/CyberCheckVehicle_Photo3D.glb"
          cutout_path="$export_dir/vehicle_cutout.png"
          blender_home="$export_dir/blender-home"
          blender_tmp="$export_dir/blender-tmp"
          blender_xdg="$export_dir/blender-xdg"
          mkdir -p "$blender_home" "$blender_tmp" "$blender_xdg/config" "$blender_xdg/cache" "$blender_xdg/data"
          blender_real="$(readlink -f "$blender_bin")"
          guest_libm=""
          for candidate in \
            /lib/x86_64-linux-gnu/libm.so.6 \
            /usr/lib/x86_64-linux-gnu/libm.so.6
          do
            if [ -f "$candidate" ] && file -L "$candidate" | grep -q 'x86-64'; then
              guest_libm="$candidate"
              break
            fi
          done
          if [ -z "$guest_libm" ]; then
            while IFS= read -r candidate; do
              if file -L "$candidate" | grep -q 'x86-64'; then
                guest_libm="$candidate"
                break
              fi
            done < <(find "$(dirname "$blender_real")" -maxdepth 5 \( -type f -o -type l \) -name 'libm.so.6' -print)
          fi
          test -n "$guest_libm" || {
            echo "::error::Compatible emulated x86_64 libm.so.6 is not installed on the ARM64 runner"
            exit 2
          }
          guest_libm_dir="$(dirname "$guest_libm")"
          python3 -m py_compile 3d/scripts/prepare_vehicle_cutout.py
          python3 3d/scripts/prepare_vehicle_cutout.py \
            --source assets/vehicle.png \
            --output "$cutout_path"
          BOX64_EMULATED_LIBS=libm.so.6 \
          BOX64_PREFER_EMULATED=1 \
          BOX64_LD_LIBRARY_PATH="$guest_libm_dir${BOX64_LD_LIBRARY_PATH:+:$BOX64_LD_LIBRARY_PATH}" \
          BOX64_DYNAREC_SAFEFLAGS=2 \
          BOX64_DYNAREC_FASTNAN=0 \
          BOX64_DYNAREC_FASTROUND=0 \
          BOX64_DYNAREC_BIGBLOCK=0 \
          HOME="$blender_home" \
          TMPDIR="$blender_tmp" \
          XDG_CONFIG_HOME="$blender_xdg/config" \
          XDG_CACHE_HOME="$blender_xdg/cache" \
          XDG_DATA_HOME="$blender_xdg/data" \
          "$blender_bin" \
            -b 3d/blend/CyberCheckVehicle_Photo3D.blend \
            --python 3d/scripts/export_web_glb.py -- \
            --output "$export_path" \
            --cutout "$cutout_path" \
            --max-bytes 4194304
          python3 glb_contract.py "$export_path" --max-bytes 4194304
          echo "GLB_EXPORT_PATH=$export_path" >> "$GITHUB_ENV"
      - name: Save verified GLB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybercheck-vehicle-glb
          path: ${{ env.GLB_EXPORT_PATH }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary export directory
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${GLB_EXPORT_DIR:-}" ]; then
            case "$GLB_EXPORT_DIR" in
              "$RUNNER_TEMP"/checkupauto-glb.*) rm -rf -- "$GLB_EXPORT_DIR" ;;
              *) echo "::error::Refusing to remove unexpected path: $GLB_EXPORT_DIR"; exit 2 ;;
            esac
          fi
