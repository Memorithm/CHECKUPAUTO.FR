name: 3D Asset CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '3d/**'
      - 'assets/vehicle.png'
      - 'glb_contract.py'
      - 'glb_contract_test.py'
      - '.github/workflows/3d-asset-ci.yml'
  push:
    branches: [main]
    paths:
      - '3d/**'
      - 'assets/vehicle.png'
      - 'glb_contract.py'
      - 'glb_contract_test.py'
      - '.github/workflows/3d-asset-ci.yml'

permissions:
  contents: write

concurrency:
  group: checkupauto-3d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-glb:
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 45
    env:
      CHECKUPAUTO_MAC_HOST: Mac-mini-de-tarek.local
      CHECKUPAUTO_MAC_USER: tarek
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}

      - name: Validate portable GLB contract
        run: |
          set -euo pipefail
          python3 -m unittest glb_contract_test
          python3 -m py_compile 3d/scripts/prepare_vehicle_cutout.py

      - name: Resolve authorized Mac SSH identity
        env:
          CHECKUPAUTO_MAC_SSH_KEY: ${{ secrets.CHECKUPAUTO_MAC_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/checkupauto-3d-mac-key"
          auth="$RUNNER_TEMP/checkupauto-3d-mac-auth"
          rm -f "$key" "$auth"
          umask 077

          verify_key() {
            candidate="$1"
            [ -r "$candidate" ] || return 1
            timeout 3 ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || return 1
            timeout 8 ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes               -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new               "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1
          }

          if [ -n "${CHECKUPAUTO_MAC_SSH_KEY:-}" ]; then
            printf '%s\n' "$CHECKUPAUTO_MAC_SSH_KEY" > "$key"
            if verify_key "$key"; then
              printf '%s\n' key > "$auth"
            else
              rm -f "$key"
            fi
          fi

          if [ ! -s "$auth" ] && timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5             -o StrictHostKeyChecking=accept-new             "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1; then
            printf '%s\n' default > "$auth"
          fi

          if [ ! -s "$auth" ]; then
            for candidate in               /root/.ssh/checkupauto_macmini_ed25519               "$HOME/.ssh/checkupauto_macmini_ed25519"               /opt/actions-runner/.ssh/checkupauto_macmini_ed25519               /root/.ssh/remoteops_thor_ed25519               "$HOME/.ssh/remoteops_thor_ed25519"               /opt/actions-runner/.ssh/remoteops_thor_ed25519; do
              if verify_key "$candidate"; then
                cp "$candidate" "$key"
                chmod 600 "$key"
                printf '%s\n' key > "$auth"
                break
              fi
            done
          fi

          [ -s "$auth" ] || { echo "::error::No authorized Mac mini SSH identity is available"; exit 2; }
          printf '%s\n' "$auth" > "$RUNNER_TEMP/checkupauto-3d-auth-path"
          if [ -s "$key" ]; then printf '%s\n' "$key" > "$RUNNER_TEMP/checkupauto-3d-key-path"; fi

      - name: Stage exact 3D source on Mac mini
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-3d-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-3d-key-path")" -o IdentitiesOnly=yes)
          fi
          remote_dir="/tmp/checkupauto-3d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_dir="$(mktemp -d "$RUNNER_TEMP/checkupauto-3d.XXXXXX")"
          printf '%s\n' "$remote_dir" > "$RUNNER_TEMP/checkupauto-3d-remote-dir"
          printf '%s\n' "$local_dir" > "$RUNNER_TEMP/checkupauto-3d-local-dir"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          tar -czf -             3d/blend/CyberCheckVehicle_Photo3D.blend             3d/scripts/export_web_glb.py             3d/scripts/prepare_vehicle_cutout.py             assets/vehicle.png             glb_contract.py |             ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               "tar -xzf - -C '$remote_dir'"

      - name: Export GLB natively on Mac mini
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-3d-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-3d-key-path")" -o IdentitiesOnly=yes)
          fi
          remote_dir="$(cat "$RUNNER_TEMP/checkupauto-3d-remote-dir")"
          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"             "set -euo pipefail
             export PATH='/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin'
             blender_bin=''
             for candidate in                '/Applications/Blender.app/Contents/MacOS/Blender'                '/opt/homebrew/bin/blender'                '/usr/local/bin/blender'; do
               if [ -x \"\$candidate\" ]; then blender_bin=\"\$candidate\"; break; fi
             done
             if [ -z \"\$blender_bin\" ]; then blender_bin=\$(command -v blender || true); fi
             if [ -z \"\$blender_bin\" ]; then
               brew_bin=\$(command -v brew || true)
               [ -n \"\$brew_bin\" ] || { echo 'BLENDER_AND_HOMEBREW_MISSING_ON_MAC'; exit 2; }
               \"\$brew_bin\" install --cask blender
               for candidate in \
                 '/Applications/Blender.app/Contents/MacOS/Blender' \
                 '/opt/homebrew/bin/blender' \
                 '/usr/local/bin/blender'; do
                 if [ -x \"\$candidate\" ]; then blender_bin=\"\$candidate\"; break; fi
               done
               if [ -z \"\$blender_bin\" ]; then blender_bin=\$(command -v blender || true); fi
             fi
             [ -n \"\$blender_bin\" ] || { echo 'BLENDER_INSTALL_FAILED_ON_MAC'; exit 2; }
             \"\$blender_bin\" --version | head -2
             cd '$remote_dir'
             python3 3d/scripts/prepare_vehicle_cutout.py                --source assets/vehicle.png                --output vehicle_cutout.png
             \"\$blender_bin\" -b 3d/blend/CyberCheckVehicle_Photo3D.blend                --python 3d/scripts/export_web_glb.py --                --output CyberCheckVehicle_Photo3D.glb                --cutout vehicle_cutout.png                --max-bytes 4194304
             python3 glb_contract.py CyberCheckVehicle_Photo3D.glb --max-bytes 4194304"

      - name: Retrieve verified GLB
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-3d-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-3d-key-path")" -o IdentitiesOnly=yes)
          fi
          remote_dir="$(cat "$RUNNER_TEMP/checkupauto-3d-remote-dir")"
          local_dir="$(cat "$RUNNER_TEMP/checkupauto-3d-local-dir")"
          scp "${ssh_args[@]}"             "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST:$remote_dir/CyberCheckVehicle_Photo3D.glb"             "$local_dir/CyberCheckVehicle_Photo3D.glb"
          python3 glb_contract.py "$local_dir/CyberCheckVehicle_Photo3D.glb" --max-bytes 4194304
          echo "GLB_EXPORT_PATH=$local_dir/CyberCheckVehicle_Photo3D.glb" >> "$GITHUB_ENV"

      - name: Save verified GLB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybercheck-vehicle-glb
          path: ${{ env.GLB_EXPORT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified GLB into same-repository PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target="assets/3d/CyberCheckVehicle_Photo3D.glb"
          mkdir -p "$(dirname "$target")"
          cp "$GLB_EXPORT_PATH" "$target"
          python3 glb_contract.py "$target" --max-bytes 4194304
          git add -- "$target"
          if git diff --cached --quiet; then
            echo "GLB_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update verified CyberCheck GLB"
          git push origin "HEAD:$PR_HEAD_REF"

      - name: Clean temporary 3D material
        if: always()
        run: |
          set -u
          if [ -s "$RUNNER_TEMP/checkupauto-3d-auth-path" ] && [ -s "$RUNNER_TEMP/checkupauto-3d-remote-dir" ]; then
            auth="$(cat "$RUNNER_TEMP/checkupauto-3d-auth-path")"
            ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
            if [ "$(cat "$auth")" = key ] && [ -s "$RUNNER_TEMP/checkupauto-3d-key-path" ]; then
              ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-3d-key-path")" -o IdentitiesOnly=yes)
            fi
            remote_dir="$(cat "$RUNNER_TEMP/checkupauto-3d-remote-dir")"
            ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST"               "rm -rf '$remote_dir'" || true
          fi
          if [ -s "$RUNNER_TEMP/checkupauto-3d-local-dir" ]; then
            local_dir="$(cat "$RUNNER_TEMP/checkupauto-3d-local-dir")"
            case "$local_dir" in
              "$RUNNER_TEMP"/checkupauto-3d.*) rm -rf -- "$local_dir" ;;
            esac
          fi
          if [ -s "$RUNNER_TEMP/checkupauto-3d-key-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/checkupauto-3d-key-path")"
          fi
          rm -f "$RUNNER_TEMP/checkupauto-3d-auth-path"                 "$RUNNER_TEMP/checkupauto-3d-key-path"                 "$RUNNER_TEMP/checkupauto-3d-remote-dir"                 "$RUNNER_TEMP/checkupauto-3d-local-dir"
