name: Apply APNs request failure patch

on:
  push:
    branches:
      - fix/apns-request-failure-classification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          apns = Path('apns_gateway.py')
          text = apns.read_text()

          old = '''INTERNAL_CONFIGURATION_REASONS = {"CredentialsMissing", "RuntimeDependencyMissing", "SigningKeyInvalid"}\nTRANSIENT_REASONS = {"InternalServerError", "ServiceUnavailable", "Shutdown", "TooManyRequests", "TooManyProviderTokenUpdates", "TransportError"}\nTRANSIENT_STATUS = {429, 500, 503}\nKNOWN_PROVIDER_REASONS = TOKEN_INVALID_REASONS | PROVIDER_CONFIGURATION_REASONS | TRANSIENT_REASONS | {\n    "BadCollapseId", "BadExpirationDate", "BadMessageId", "BadPath", "BadPriority",\n    "DuplicateHeaders", "IdleTimeout", "MethodNotAllowed", "MissingDeviceToken",\n    "PayloadEmpty", "PayloadTooLarge",\n}\nKNOWN_ERROR_REASONS = KNOWN_PROVIDER_REASONS | INTERNAL_CONFIGURATION_REASONS\nUNKNOWN_PROVIDER_REASON = "UnknownProviderError"\n'''
          new = '''INTERNAL_CONFIGURATION_REASONS = {"CredentialsMissing", "RuntimeDependencyMissing", "SigningKeyInvalid"}\nPROVIDER_REQUEST_REASONS = {\n    "BadCollapseId", "BadExpirationDate", "BadMessageId", "BadPath", "BadPriority",\n    "DuplicateHeaders", "MethodNotAllowed", "MissingDeviceToken", "PayloadEmpty", "PayloadTooLarge",\n}\nINTERNAL_REQUEST_REASONS = {"CategoryInvalid", "EnvironmentInvalid", "PayloadInvalid"}\nTRANSIENT_REASONS = {\n    "IdleTimeout", "InternalServerError", "ServiceUnavailable", "Shutdown", "TooManyRequests",\n    "TooManyProviderTokenUpdates", "TransportError",\n}\nTRANSIENT_STATUS = {429, 500, 503}\nREQUEST_STATUS = {400, 404, 405, 413}\nKNOWN_PROVIDER_REASONS = (\n    TOKEN_INVALID_REASONS | PROVIDER_CONFIGURATION_REASONS | PROVIDER_REQUEST_REASONS | TRANSIENT_REASONS\n)\nKNOWN_ERROR_REASONS = KNOWN_PROVIDER_REASONS | INTERNAL_CONFIGURATION_REASONS | INTERNAL_REQUEST_REASONS\nREQUEST_REASONS = PROVIDER_REQUEST_REASONS | INTERNAL_REQUEST_REASONS\nUNKNOWN_PROVIDER_REASON = "UnknownProviderError"\n'''
          if old not in text:
              raise SystemExit('APNs constants anchor not found')
          text = text.replace(old, new, 1)

          old = '''        self.token_invalid = self.status == 410 or self.reason in TOKEN_INVALID_REASONS\n        self.provider_error = self.reason in (PROVIDER_CONFIGURATION_REASONS | INTERNAL_CONFIGURATION_REASONS) or self.status in {403, 404, 405}\n        self.retryable = self.status in TRANSIENT_STATUS or self.reason in TRANSIENT_REASONS\n'''
          new = '''        self.token_invalid = self.status == 410 or self.reason in TOKEN_INVALID_REASONS\n        self.provider_error = self.reason in (PROVIDER_CONFIGURATION_REASONS | INTERNAL_CONFIGURATION_REASONS) or self.status == 403\n        self.request_error = self.reason in REQUEST_REASONS or self.status in REQUEST_STATUS\n        self.retryable = self.status in TRANSIENT_STATUS or self.reason in TRANSIENT_REASONS\n'''
          if old not in text:
              raise SystemExit('APNSError classification anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if category:\n        if len(category) > 64 or not re.fullmatch(r"[A-Za-z0-9._-]+", category):\n            raise ValueError("Catégorie APNs invalide")\n        aps["category"] = category\n    payload = {"aps": aps}\n    if data:\n        payload["data"] = data\n    return payload\n\n\ndef send(\n'''
          new = '''    if category:\n        if len(category) > 64 or not re.fullmatch(r"[A-Za-z0-9._-]+", category):\n            raise APNSError(0, "CategoryInvalid")\n        aps["category"] = category\n    payload = {"aps": aps}\n    if data:\n        payload["data"] = data\n    return payload\n\n\ndef _environment_host(value: object) -> tuple[str, str]:\n    environment = str(value or "sandbox").strip().lower()\n    if environment not in {"sandbox", "production"}:\n        raise APNSError(0, "EnvironmentInvalid")\n    host = "https://api.push.apple.com" if environment == "production" else "https://api.sandbox.push.apple.com"\n    return environment, host\n\n\ndef _encoded_payload(\n    title: str,\n    body: str,\n    *,\n    data: dict | None = None,\n    notification_category: str = "",\n) -> bytes:\n    payload = _notification_payload(\n        title,\n        body,\n        data=data,\n        notification_category=notification_category,\n    )\n    try:\n        raw = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")\n    except (TypeError, ValueError, UnicodeError) as exc:\n        raise APNSError(0, "PayloadInvalid") from exc\n    if len(raw) > 4096:\n        raise APNSError(413, "PayloadTooLarge")\n    return raw\n\n\ndef send(\n'''
          if old not in text:
              raise SystemExit('APNs payload anchor not found')
          text = text.replace(old, new, 1)

          old = '''    cfg = _config()\n    if not status()["configured"]:\n        raise APNSError(0, "CredentialsMissing")\n    try:\n        import httpx\n    except ImportError as exc:\n        raise APNSError(0, "RuntimeDependencyMissing") from exc\n    environment = str(environment or "sandbox").strip().lower()\n    if environment not in {"sandbox", "production"}:\n        raise ValueError("Environnement APNs invalide")\n    host = "https://api.push.apple.com" if environment == "production" else "https://api.sandbox.push.apple.com"\n    payload = _notification_payload(\n        title,\n        body,\n        data=data,\n        notification_category=notification_category,\n    )\n    raw = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")\n    if len(raw) > 4096:\n        raise ValueError("payload APNs trop volumineux")\n'''
          new = '''    environment, host = _environment_host(environment)\n    raw = _encoded_payload(\n        title,\n        body,\n        data=data,\n        notification_category=notification_category,\n    )\n    cfg = _config()\n    if not status()["configured"]:\n        raise APNSError(0, "CredentialsMissing")\n    try:\n        import httpx\n    except ImportError as exc:\n        raise APNSError(0, "RuntimeDependencyMissing") from exc\n'''
          if old not in text:
              raise SystemExit('APNs send anchor not found')
          text = text.replace(old, new, 1)
          apns.write_text(text)

          broker = Path('notification_broker.py')
          text = broker.read_text()
          old = '''    if isinstance(exc, push_transport.APNSError):\n        if exc.token_invalid:\n            return "permanent"\n        if exc.provider_error:\n            return "configuration"\n        if exc.retryable:\n            return "transient"\n    return "transient"\n'''
          new = '''    if isinstance(exc, push_transport.APNSError):\n        if exc.token_invalid:\n            return "permanent"\n        if exc.provider_error:\n            return "configuration"\n        if getattr(exc, "request_error", False):\n            return "request"\n        if exc.retryable:\n            return "transient"\n    return "transient"\n'''
          if old not in text:
              raise SystemExit('broker classification anchor not found')
          text = text.replace(old, new, 1)

          old = '''def _record_transport_failure(transport_key: str, failure_class: str, exc: Exception, now: datetime.datetime, attempt: int) -> tuple[str, int]:\n    now_iso = now.isoformat(timespec="seconds")\n'''
          new = '''def _record_transport_failure(transport_key: str, failure_class: str, exc: Exception, now: datetime.datetime, attempt: int) -> tuple[str, int]:\n    if failure_class == "request":\n        # Deterministic caller/payload faults are delivery evidence, not transport-health failures.\n        return "", 0\n    now_iso = now.isoformat(timespec="seconds")\n'''
          if old not in text:
              raise SystemExit('broker transport failure anchor not found')
          text = text.replace(old, new, 1)
          broker.write_text(text)

          Path('apns_request_failure_boundary_test.py').write_text('''import tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nimport apns_gateway as apns\nimport notification_broker as broker\n\n\nclass APNSRequestFailureBoundaryTest(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.TemporaryDirectory()\n        self.old_dir = broker.DATA_DIR\n        self.old_db = broker.DB\n        broker.DATA_DIR = Path(self.tmp.name)\n        broker.DB = broker.DATA_DIR / "broker.sqlite3"\n        broker.init_db()\n\n    def tearDown(self):\n        broker.DATA_DIR = self.old_dir\n        broker.DB = self.old_db\n        self.tmp.cleanup()\n\n    def test_provider_request_reasons_are_non_retryable_request_errors(self):\n        for status, reason in (\n            (400, "BadPriority"),\n            (404, "BadPath"),\n            (405, "MethodNotAllowed"),\n            (413, "PayloadTooLarge"),\n        ):\n            with self.subTest(status=status, reason=reason):\n                exc = apns.APNSError(status, reason)\n                self.assertTrue(exc.request_error)\n                self.assertFalse(exc.provider_error)\n                self.assertFalse(exc.retryable)\n                self.assertFalse(exc.token_invalid)\n\n        idle = apns.APNSError(400, "IdleTimeout")\n        self.assertTrue(idle.retryable)\n        self.assertFalse(idle.request_error)\n\n    def test_local_request_validation_uses_bounded_apns_errors(self):\n        with self.assertRaises(apns.APNSError) as ctx:\n            apns._environment_host("qa")\n        self.assertEqual(ctx.exception.reason, "EnvironmentInvalid")\n        self.assertTrue(ctx.exception.request_error)\n\n        with self.assertRaises(apns.APNSError) as ctx:\n            apns._encoded_payload("Titre", "Message", notification_category="bad category")\n        self.assertEqual(ctx.exception.reason, "CategoryInvalid")\n\n        with self.assertRaises(apns.APNSError) as ctx:\n            apns._encoded_payload("Titre", "Message", data={"bad": object()})\n        self.assertEqual(ctx.exception.reason, "PayloadInvalid")\n\n        with self.assertRaises(apns.APNSError) as ctx:\n            apns._encoded_payload("Titre", "Message", data={"blob": "x" * 5000})\n        self.assertEqual(ctx.exception.reason, "PayloadTooLarge")\n        self.assertEqual(ctx.exception.status, 413)\n\n    @patch.object(broker.push_transport, "send")\n    def test_broker_records_request_failure_without_backoff_or_transport_circuit(self, send_push):\n        send_push.side_effect = apns.APNSError(400, "BadPriority")\n        token = "ab" * 32\n        with self.assertRaises(apns.APNSError):\n            broker.send_push(\n                token,\n                "Rappel",\n                "Message",\n                category="ct_due",\n                reference="request-fault",\n            )\n\n        with broker.connect() as db:\n            row = db.execute(\n                "SELECT status,failure_class,next_attempt_at,last_error FROM notification_delivery WHERE reference=?",\n                ("request-fault",),\n            ).fetchone()\n            health = db.execute(\n                "SELECT * FROM notification_transport_health WHERE transport_key=?",\n                ("push:apns:sandbox",),\n            ).fetchone()\n\n        self.assertEqual(row["status"], "failed")\n        self.assertEqual(row["failure_class"], "request")\n        self.assertEqual(row["next_attempt_at"], "")\n        self.assertEqual(row["last_error"], "APNSError status=400 reason=BadPriority")\n        self.assertIsNone(health)\n        state = broker.status()\n        self.assertEqual(state["failureCounts"]["request"], 1)\n        self.assertEqual(state["counts"]["deferred"], 0)\n        self.assertEqual(state["resilience"]["circuitsOpen"], 0)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          Path('.github/workflows/autopatch-apns-request.yml').unlink()
          PY
      - name: Validate focused boundary
        shell: bash
        run: |
          python3 -m compileall -q apns_gateway.py notification_broker.py apns_request_failure_boundary_test.py
          python3 -m unittest -q apns_request_failure_boundary_test
          python3 scripts/precommit_security.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add -A
          git commit -m "fix: classify deterministic APNs request failures"
          git push origin HEAD
