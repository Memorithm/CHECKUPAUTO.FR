name: Hostinger staging release gate

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'admin_server.py'
      - 'deploy/hostinger/**'
      - 'hostinger_staging_*_test.py'
      - '.github/workflows/hostinger-staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkupauto-hostinger-staging-release-gate
  cancel-in-progress: true

jobs:
  release-gate:
    # Memorithm/RemoteOps is the privileged deployment control plane. This
    # repository only proves that the exact main revision is safe to hand off;
    # it must never depend on RemoteOps-scoped SSH material or runner labels.
    if: github.repository == 'Memorithm/CHECKUPAUTO.FR'
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 15
    env:
      CHECKUPAUTO_STAGING_HOST: stage.179.198.210.187.sslip.io
      CHECKUPAUTO_IMAGE_TAG: release-gate
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          echo "HOSTINGER_RELEASE_SOURCE_VERIFIED=$GITHUB_SHA"

      - name: Validate Hostinger deployment contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/hostinger/deploy-staging.sh
          python3 -m compileall -q admin_server.py deploy
          python3 -m venv "$RUNNER_TEMP/checkupauto-hostinger-release-gate"
          "$RUNNER_TEMP/checkupauto-hostinger-release-gate/bin/pip" install --disable-pip-version-check --quiet -r requirements.txt
          "$RUNNER_TEMP/checkupauto-hostinger-release-gate/bin/python" -m unittest -v \
            admin_server_runtime_test.py \
            hostinger_staging_tls_readiness_test.py \
            hostinger_staging_control_plane_test.py \
            hostinger_staging_private_permissions_test.py \
            hostinger_staging_deployment_provenance_test.py

      - name: Validate Docker compose model
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/hostinger/docker-compose.yml config >"$RUNNER_TEMP/checkupauto-hostinger-compose.yml"
          grep -q 'checkupauto-staging-web' "$RUNNER_TEMP/checkupauto-hostinger-compose.yml"
          grep -q 'stage.179.198.210.187.sslip.io' "$RUNNER_TEMP/checkupauto-hostinger-compose.yml"
          echo "HOSTINGER_RELEASE_READY_FOR_REMOTEOPS=$GITHUB_SHA"
