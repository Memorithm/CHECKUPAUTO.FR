name: Temporary compliance admin route patch

on:
  push:
    branches:
      - fix/compliance-admin-snapshot

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Apply bounded admin route patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("admin_server.py")
          source = path.read_text(encoding="utf-8")

          import_anchor = "import compliance_store as compliance\n"
          import_replacement = import_anchor + "import compliance_admin as compliance_admin\n"
          if "import compliance_admin as compliance_admin\n" not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit("admin_server compliance import anchor changed")
              source = source.replace(import_anchor, import_replacement, 1)

          route = (
              "  if path=='/api/admin/compliance':\n"
              "   if not self.authorized(): return self.require_auth()\n"
              "   try: return self.send_json(compliance_admin.snapshot())\n"
              "   except Exception: return self.send_json({'ok':False,'error':'compliance_snapshot_unavailable'},500)\n"
          )
          route_anchor = "  if path=='/api/admin/readiness':\n"
          if "if path=='/api/admin/compliance':" not in source:
              if source.count(route_anchor) != 1:
                  raise SystemExit("admin_server readiness route anchor changed")
              source = source.replace(route_anchor, route + route_anchor, 1)

          path.write_text(source, encoding="utf-8")
          PY
          git rm .github/workflows/_patch-compliance-admin-route.yml
          git config user.name "CHECKUPAUTO"
          git config user.email "contact@checkupauto.fr"
          git add admin_server.py
          git diff --cached --check
          git commit -m "fix: restore compliance admin snapshot route"
          git push origin "HEAD:${GITHUB_REF_NAME}"
