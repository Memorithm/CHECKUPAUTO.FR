name: Apple Release Probe

on:
  pull_request:
    paths:
      - '.github/workflows/apple-release-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-release-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 10
    env:
      CHECKUPAUTO_MAC_HOST: Mac-mini-de-tarek.local
      CHECKUPAUTO_MAC_USER: tarek
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve authorized Mac SSH identity
        env:
          CHECKUPAUTO_MAC_SSH_KEY: ${{ secrets.CHECKUPAUTO_MAC_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/checkupauto-apple-probe-key"
          auth="$RUNNER_TEMP/checkupauto-apple-probe-auth"
          rm -f "$key" "$auth"
          umask 077

          verify_key() {
            candidate="$1"
            [ -r "$candidate" ] || return 1
            timeout 3 ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || return 1
            timeout 8 ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes               -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new               "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1
          }

          if [ -n "${CHECKUPAUTO_MAC_SSH_KEY:-}" ]; then
            printf '%s\n' "$CHECKUPAUTO_MAC_SSH_KEY" > "$key"
            if verify_key "$key"; then printf '%s\n' key > "$auth"; else rm -f "$key"; fi
          fi

          if [ ! -s "$auth" ] && timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5             -o StrictHostKeyChecking=accept-new             "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" true >/dev/null 2>&1; then
            printf '%s\n' default > "$auth"
          fi

          if [ ! -s "$auth" ]; then
            for candidate in               /root/.ssh/checkupauto_macmini_ed25519               "$HOME/.ssh/checkupauto_macmini_ed25519"               /opt/actions-runner/.ssh/checkupauto_macmini_ed25519               /root/.ssh/remoteops_thor_ed25519               "$HOME/.ssh/remoteops_thor_ed25519"               /opt/actions-runner/.ssh/remoteops_thor_ed25519               /root/.ssh/id_ed25519               "$HOME/.ssh/id_ed25519"               /opt/actions-runner/.ssh/id_ed25519               /root/.ssh/id_rsa               "$HOME/.ssh/id_rsa"               /opt/actions-runner/.ssh/id_rsa; do
              if verify_key "$candidate"; then
                cp "$candidate" "$key"
                chmod 600 "$key"
                printf '%s\n' key > "$auth"
                break
              fi
            done
          fi

          [ -s "$auth" ] || { echo "::error::No authorized Mac mini SSH identity is available"; exit 2; }
          printf '%s\n' "$auth" > "$RUNNER_TEMP/checkupauto-apple-probe-auth-path"
          if [ -s "$key" ]; then printf '%s\n' "$key" > "$RUNNER_TEMP/checkupauto-apple-probe-key-path"; fi

      - name: Probe non-secret Apple release state on Mac mini
        run: |
          set -euo pipefail
          auth="$(cat "$RUNNER_TEMP/checkupauto-apple-probe-auth-path")"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new)
          if [ "$(cat "$auth")" = key ]; then
            ssh_args+=(-i "$(cat "$RUNNER_TEMP/checkupauto-apple-probe-key-path")" -o IdentitiesOnly=yes)
          fi

          ssh "${ssh_args[@]}" "$CHECKUPAUTO_MAC_USER@$CHECKUPAUTO_MAC_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

          printf 'MACOS='; sw_vers -productVersion
          printf 'XCODE='; xcodebuild -version | tr '\n' ' '; echo

          identities="$(security find-identity -v -p codesigning 2>/dev/null || true)"
          team_ids="$(
            printf '%s\n' "$identities" |
              grep -Eo '\([A-Z0-9]{10}\)' |
              tr -d '()' |
              sort -u |
              paste -sd, -
          )"
          if [ -n "$team_ids" ]; then
            echo "APPLE_SIGNING_TEAM_IDS=$team_ids"
          else
            echo "APPLE_SIGNING_TEAM_IDS=none"
          fi

          profile_teams="$(
            { find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"                    "$HOME/Library/MobileDevice/Provisioning Profiles"                    -maxdepth 1 -type f 2>/dev/null || true; } |
            while IFS= read -r profile; do
              security cms -D -i "$profile" 2>/dev/null |
                plutil -extract TeamIdentifier.0 raw -o - - 2>/dev/null || true
            done |
            grep -E '^[A-Z0-9]{10}$' |
            sort -u |
            paste -sd, -
          )"
          if [ -n "$profile_teams" ]; then
            echo "PROVISIONING_TEAM_IDS=$profile_teams"
          else
            echo "PROVISIONING_TEAM_IDS=none"
          fi

          key_ids="$(
            { find "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys" "$HOME/private_keys"                 -maxdepth 1 -type f -name 'AuthKey_*.p8' 2>/dev/null || true; } |
              sed -E 's#^.*/AuthKey_([A-Za-z0-9]{10})\.p8$#\1#' |
              grep -E '^[A-Za-z0-9]{10}$' |
              sort -u |
              paste -sd, -
          )"
          if [ -n "$key_ids" ]; then
            echo "ASC_LOCAL_KEY_IDS=$key_ids"
          else
            echo "ASC_LOCAL_KEY_IDS=none"
          fi

          if defaults read com.apple.dt.Xcode >/dev/null 2>&1; then
            echo "XCODE_PREFERENCES_PRESENT=yes"
          else
            echo "XCODE_PREFERENCES_PRESENT=no"
          fi

          if security find-generic-password -s Xcode.Accounts >/dev/null 2>&1; then
            echo "XCODE_ACCOUNT_KEYCHAIN_HINT=yes"
          else
            echo "XCODE_ACCOUNT_KEYCHAIN_HINT=no"
          fi
          REMOTE

      - name: Clean ephemeral SSH identity
        if: always()
        run: |
          set -u
          if [ -s "$RUNNER_TEMP/checkupauto-apple-probe-key-path" ]; then
            rm -f "$(cat "$RUNNER_TEMP/checkupauto-apple-probe-key-path")"
          fi
          rm -f "$RUNNER_TEMP/checkupauto-apple-probe-auth-path"                 "$RUNNER_TEMP/checkupauto-apple-probe-key-path"
