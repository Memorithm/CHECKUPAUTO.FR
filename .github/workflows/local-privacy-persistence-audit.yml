name: Local privacy persistence audit
on:
  push:
    branches: [audit/local-privacy-persistence]
    paths:
      - 'scripts/audit-local-persistence.py'
      - '.github/workflows/local-privacy-persistence-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/audit-local-persistence.py
