name: Inspect CheckupAuto runtime

on:
  push:
    branches: [automation/runtime-inspect]
    paths:
      - '.github/workflows/inspect-runtime.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect production checkout and service without mutation
        run: |
          set -euo pipefail
          target=/root/CyberCheckLive
          echo "RUNNER_USER=$(id -un)"
          echo "RUNNER_HOST=$(hostname)"
          if [ ! -d "$target/.git" ]; then
            echo 'RUNTIME_CHECKOUT=missing'
            exit 2
          fi
          echo 'RUNTIME_CHECKOUT=present'
          echo "RUNTIME_HEAD=$(git -C "$target" rev-parse HEAD)"
          echo "RUNTIME_BRANCH=$(git -C "$target" branch --show-current)"
          dirty="$(git -C "$target" status --porcelain | wc -l | tr -d ' ')"
          echo "RUNTIME_DIRTY_ENTRIES=$dirty"
          echo "SERVICE_STATE=$(systemctl is-active cybercheck.service || true)"
          http_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8765/ || true)"
          echo "LOCAL_HTTP_CODE=$http_code"
          git -C "$target" fetch --quiet origin main
          echo "RUNTIME_ORIGIN_MAIN=$(git -C "$target" rev-parse origin/main)"
      - name: Remove runtime inspection bootstrap
        if: always()
        run: |
          rm -f .github/workflows/inspect-runtime.yml
          git add -A
          git config user.name 'CHECKUPAUTO Automation'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'chore: remove runtime inspection bootstrap' || true
          git push origin HEAD:automation/runtime-inspect || true
