name: Temporary mobile claim branch patch

on:
  push:
    branches:
      - feat/mobile-claim-http-dispatch

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply bounded admin server patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin_server.py')
          source = path.read_text()

          old_import = 'import mobile_devices as mobile_devices\nimport mobile_claim_delivery as mobile_claim_delivery\n'
          new_import = 'import mobile_devices as mobile_devices\nimport mobile_claim_dispatch as mobile_claim_dispatch\nimport mobile_claim_delivery as mobile_claim_delivery\n'
          if source.count(old_import) != 1:
              raise SystemExit('unexpected mobile import boundary')
          source = source.replace(old_import, new_import, 1)

          old_route = '''  if path=='/api/mobile/claims/consume':
           try:
            ctype=(self.headers.get('Content-Type') or '').split(';',1)[0].strip().lower()
            if ctype!='application/json': return self.send_json({'ok':False,'error':'content_type_not_allowed'},415)
            payload=self._read_json()
            result=mobile_devices.consume_vehicle_claim(payload)
            try:
             mobile_authoritative_sync.sync_installation(str(payload.get('installationId') or ''))
            except Exception:
             pass
            return self.send_json(result,200)
           except PermissionError as exc: return self.send_json({'ok':False,'error':'mobile_request_forbidden'},403)
           except Exception: return self.send_json({'ok':False,'error':'mobile_request_invalid'},400)
          '''
          new_route = '''  if path=='/api/mobile/claims/consume':
           try:
            ctype=(self.headers.get('Content-Type') or '').split(';',1)[0].strip().lower()
            if ctype!='application/json': return self.send_json({'ok':False,'error':'content_type_not_allowed'},415)
            result=mobile_claim_dispatch.consume_with_authoritative_refresh(self._read_json())
            return self.send_json(result,200)
           except PermissionError as exc: return self.send_json({'ok':False,'error':'mobile_request_forbidden'},403)
           except Exception: return self.send_json({'ok':False,'error':'mobile_request_invalid'},400)
          '''
          if source.count(old_route) != 1:
              raise SystemExit('unexpected mobile claim route boundary')
          source = source.replace(old_route, new_route, 1)
          path.write_text(source)
          PY
          python3 -m unittest mobile_claim_dispatch_test.py mobile_claim_api_test.py
      - name: Commit bounded patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/branch-patch-mobile-claim.yml
          git add admin_server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: route mobile claims through typed dispatcher'
          git push origin HEAD:feat/mobile-claim-http-dispatch
