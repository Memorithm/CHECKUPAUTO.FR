name: Agent compliance review console patch

on:
  push:
    branches: [agent/compliance-review-console]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, Linux, ARM64, internal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply deterministic console patch
        run: python3 .github/agent-patch-compliance-review-console.py
      - name: Check JavaScript syntax
        run: node --check admin/compliance.js
      - name: Create isolated Python test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare isolated runtime data
        run: |
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/checkupauto-compliance-console.XXXXXX")"
          chmod 700 "$runtime_dir"
          printf 'CYBERCHECK_DATA_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
      - name: Run focused regressions
        run: .ci-venv/bin/python -m unittest admin_compliance_review_ui_test.py admin_processing_review_api_test.py admin_register_attestation_api_test.py compliance_admin_http_test.py
      - name: Check tracked files for secrets
        run: python3 scripts/precommit_security.py
      - name: Commit intended changes only
        run: |
          git rm .github/agent-patch-compliance-review-console.py .github/workflows/agent-compliance-review-console.yml
          git add admin/index.html admin/compliance.js admin_compliance_review_ui_test.py
          git config user.name "CHECKUPAUTO"
          git config user.email "contact@checkupauto.fr"
          git commit -m "feat: operate compliance reviews from admin console"
          git push origin HEAD:agent/compliance-review-console
      - name: Clean isolated runtime data
        if: always()
        run: |
          if [ -n "${CYBERCHECK_DATA_DIR:-}" ]; then
            rm -rf "$CYBERCHECK_DATA_DIR"
          fi
