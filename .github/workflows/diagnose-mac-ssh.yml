name: Diagnose Mac mini SSH path

on:
  push:
    branches: [automation/ios-runtime-validation]
    paths:
      - '.github/workflows/diagnose-mac-ssh.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, internal]
    timeout-minutes: 5
    env:
      HOST: Mac-mini-de-tarek.local
      USER: tarek
    steps:
      - uses: actions/checkout@v5
      - name: Check name resolution and TCP 22
        run: |
          set -u
          getent hosts "$HOST" || true
          if timeout 5 bash -c "</dev/tcp/$HOST/22"; then
            echo 'SSH_PORT_REACHABLE=yes'
          else
            echo 'SSH_PORT_REACHABLE=no'
          fi
      - name: Try configured/default SSH authentication
        run: |
          set -u
          set +e
          output="$(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$USER@$HOST" 'printf SSH_AUTH_OK' 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] && [ "$output" = 'SSH_AUTH_OK' ]; then
            echo 'SSH_AUTH=ok'
          else
            echo "SSH_AUTH=failed rc=$rc"
            printf '%s\n' "$output" | sed -E 's#(/[^ ]+)+#<path>#g' | head -5
            exit 1
          fi
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm -f .github/workflows/diagnose-mac-ssh.yml
          git add -A
          git config user.name 'CHECKUPAUTO Automation'
          git config user.email 'contact@checkupauto.fr'
          git commit -m 'chore: remove Mac SSH diagnostic bootstrap' || true
          git push origin HEAD:automation/ios-runtime-validation || true
