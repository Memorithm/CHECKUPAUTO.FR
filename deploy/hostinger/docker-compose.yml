name: checkupauto-staging

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: checkupauto/site:${CHECKUPAUTO_IMAGE_TAG:-staging}
    container_name: checkupauto-staging-web
    restart: unless-stopped
    environment:
      CYBERCHECK_BIND_HOST: "0.0.0.0"
      CYBERCHECK_BIND_PORT: "8765"
      CYBERCHECK_DATA_DIR: "/var/lib/checkupauto/data"
      CYBERCHECK_PRIVATE_DIR: "/var/lib/checkupauto/private"
      CYBERCHECK_SECURITY_DIR: "/var/lib/checkupauto/security"
      CYBERCHECK_INTEGRITY_DIR: "/var/lib/checkupauto/integrity"
      CYBERCHECK_MOBILE_PUSH_ENABLED: "0"
      CYBERCHECK_PAYMENT_REQUIRED: "1"
    volumes:
      - /srv/checkupauto/staging/state/data:/var/lib/checkupauto/data
      - /srv/checkupauto/staging/state/private:/var/lib/checkupauto/private
      - /srv/checkupauto/staging/state/security:/var/lib/checkupauto/security
      - /srv/checkupauto/staging/state/integrity:/var/lib/checkupauto/integrity
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.checkupauto-staging.loadbalancer.server.port=8765
      - traefik.http.routers.checkupauto-staging-http.rule=Host(`${CHECKUPAUTO_STAGING_HOST}`)
      - traefik.http.routers.checkupauto-staging-http.entrypoints=http
      - traefik.http.routers.checkupauto-staging-http.middlewares=checkupauto-staging-https
      - traefik.http.middlewares.checkupauto-staging-https.redirectscheme.scheme=https
      - traefik.http.middlewares.checkupauto-staging-https.redirectscheme.permanent=true
      - traefik.http.routers.checkupauto-staging.rule=Host(`${CHECKUPAUTO_STAGING_HOST}`)
      - traefik.http.routers.checkupauto-staging.entrypoints=https
      - traefik.http.routers.checkupauto-staging.tls=true
      - traefik.http.routers.checkupauto-staging.tls.certresolver=letsencrypt
      - traefik.http.routers.checkupauto-staging.service=checkupauto-staging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  coolify:
    external: true
