name: checkupauto-public-redirect
services:
  redirect:
    image: python:3.12-slim
    restart: unless-stopped
    user: "10001:10001"
    command: ["python", "-B", "/app/public-redirect.py"]
    volumes:
      - ./public-redirect.py:/app/public-redirect.py:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.checkupauto-public-redirect.loadbalancer.server.port=8080
      - traefik.http.routers.checkupauto-public-redirect-http.rule=Host(`checkupauto.fr`) || Host(`www.checkupauto.fr`)
      - traefik.http.routers.checkupauto-public-redirect-http.entrypoints=http
      - traefik.http.routers.checkupauto-public-redirect-http.service=checkupauto-public-redirect
      - traefik.http.routers.checkupauto-public-redirect.rule=Host(`checkupauto.fr`) || Host(`www.checkupauto.fr`)
      - traefik.http.routers.checkupauto-public-redirect.entrypoints=https
      - traefik.http.routers.checkupauto-public-redirect.tls=true
      - traefik.http.routers.checkupauto-public-redirect.tls.certresolver=letsencrypt
      - traefik.http.routers.checkupauto-public-redirect.service=checkupauto-public-redirect
networks:
  coolify:
    external: true
