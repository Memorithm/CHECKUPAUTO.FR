name: CheckupAutoReminder
options:
  bundleIdPrefix: fr.checkupauto
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 0.3.14
    CHECKUPAUTO_ENVIRONMENT: production
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  CheckupAutoReminder:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: LiveActivityResources
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CheckupAutoLiveActivity
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CheckupAutoEnvironment: "$(CHECKUPAUTO_ENVIRONMENT)"
        CFBundleDisplayName: Checkup Auto
        LSApplicationQueriesSchemes:
          - waze
          - comgooglemaps
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.checkupauto.reminder.auth
            CFBundleURLSchemes:
              - checkupauto
        BGTaskSchedulerPermittedIdentifiers:
          - fr.checkupauto.reminder.live-activity-refresh
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.checkupauto.reminder
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CheckupAutoReminder.entitlements
    scheme:
      testTargets:
        - CheckupAutoReminderTests
  CheckupAutoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivityWidget
      - Sources/MobileAPI.swift
      - Shared
      - path: LiveActivityResources
        buildPhase: resources
    info:
      path: LiveActivityWidget/Info.plist
      properties:
        CheckupAutoEnvironment: "$(CHECKUPAUTO_ENVIRONMENT)"
        CFBundleDisplayName: Checkup Auto Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.checkupauto.reminder.liveactivity
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  CheckupAutoReminderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/DeviceRegistrationTests.swift
      - Tests/NotificationRoutingTests.swift
      - Tests/MobileAPITests.swift
      - Tests/MobileBootstrapTests.swift
      - Tests/MobileDeadlineSyncTests.swift
      - Tests/ReminderPlanTests.swift
      - Tests/VehicleClaimTests.swift
      - Tests/ReferralWalletClaimTests.swift
      - Tests/AuthoritativeInventoryTests.swift
      - Tests/VehicleRegistrationRulesTests.swift
      - Tests/CheckupControlActivityPolicyTests.swift
    dependencies:
      - target: CheckupAutoReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.checkupauto.reminder.tests
        GENERATE_INFOPLIST_FILE: YES
